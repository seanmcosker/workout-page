<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress — Workout Tracker</title>
  <style>
    :root {
      --bg: #0d0d14; --surface: #13131e; --surface2: #1b1b2e; --border: #24243c;
      --accent: #7c3aed; --accent-h: #6d28d9; --green: #10b981; --green-h: #059669;
      --text: #e2e8f0; --dim: #94a3b8; --muted: #4a5570;
      --yellow: #f59e0b; --red: #ef4444; --r: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; min-height: 100vh; font-size: 14px; line-height: 1.5; }
    #app { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }
    .page-nav { display: flex; align-items: center; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
    .pnav-a { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; transition: all .15s; }
    .pnav-a:hover { background: var(--surface2); color: var(--text); }
    .pnav-a.cur { background: var(--surface2); color: var(--accent); }
    .pnav-sep { color: var(--border); font-size: 16px; }
    .hdr { display: flex; justify-content: space-between; align-items: flex-start; padding: 24px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; gap: 12px; }
    .hdr h1 { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .hdr-date { font-size: 13px; color: var(--dim); margin-top: 2px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 6px 8px; border-radius: 6px; color: var(--dim); transition: background .15s; }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }
    .close-btn { background: none; border: none; cursor: pointer; font-size: 24px; color: var(--muted); line-height: 1; padding: 0 2px; transition: color .15s; }
    .close-btn:hover { color: var(--text); }
    .sec-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 14px; }
    .tab-strip { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .t-btn { background: none; border: none; padding: 9px 18px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
    .t-btn:hover { color: var(--dim); }
    .t-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
    @media (max-width: 620px) { .stats-row { grid-template-columns: repeat(2,1fr); } }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
    .stat-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); margin-bottom: 6px; }
    .stat-val { font-size: 22px; font-weight: 800; color: #fff; line-height: 1; }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .stb { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: var(--r); padding: 20px; margin-bottom: 28px; }
    .stb-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .stb-day { font-size: 13px; font-weight: 700; color: var(--dim); }
    .stb-scheme-badge { font-size: 11px; font-weight: 600; color: var(--accent); background: rgba(124,58,237,.12); padding: 2px 10px; border-radius: 12px; }
    .stb-lift { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -1px; margin-bottom: 16px; }
    .stb-body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 580px) { .stb-body { grid-template-columns: 1fr; } }
    .stb-sets-lbl, .stb-beat-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); margin-bottom: 8px; }
    .stb-set { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; font-size: 14px; margin-bottom: 4px; background: var(--surface2); }
    .stb-set.top { background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.2); }
    .stb-set-w { font-weight: 700; color: #fff; min-width: 60px; }
    .stb-set-r { color: var(--dim); flex: 1; }
    .stb-set-pct { font-size: 11px; color: var(--muted); }
    .stb-beat-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .stb-beat-box.empty { opacity: .5; }
    .stb-beat-val { font-size: 22px; font-weight: 800; color: #fff; margin: 4px 0; }
    .stb-beat-e1rm { font-size: 12px; color: var(--muted); }
    .stb-beat-date { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .pr-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; }
    @media (max-width: 620px) { .pr-grid { grid-template-columns: 1fr; } }
    .pr-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .pr-card-hdr { display: flex; justify-content: space-between; align-items: baseline; }
    .pr-lift { font-size: 16px; font-weight: 800; color: #fff; }
    .pr-tm { font-size: 11px; color: var(--muted); }
    .pr-best-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.8px; color: var(--yellow); margin-bottom: 4px; }
    .pr-best-e1rm { font-size: 28px; font-weight: 800; color: #fff; line-height: 1; }
    .pr-best-set { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .pr-spark-row { display: flex; align-items: center; gap: 10px; }
    .pr-spark-lbl { font-size: 10px; color: var(--muted); }
    .pr-hist { border-top: 1px solid var(--border); padding-top: 10px; }
    .pr-hist-row { display: grid; grid-template-columns: 90px 1fr 52px; gap: 6px; padding: 4px 0; border-bottom: 1px solid rgba(36,36,60,.5); font-size: 12px; }
    .pr-hist-row:last-child { border-bottom: none; }
    .pr-hist-date { color: var(--muted); }
    .pr-hist-sets { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pr-hist-e { color: #fff; font-weight: 600; text-align: right; }
    .pr-empty-msg { color: var(--muted); font-size: 13px; font-style: italic; }
    .chart-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; margin-bottom: 16px; }
    .chart-hdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .chart-title { font-size: 14px; font-weight: 700; color: #fff; }
    .chart-sub { font-size: 11px; color: var(--muted); }
    .chart-wrap { overflow: hidden; border-radius: 4px; }
    .no-data { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 13px; font-style: italic; }
    .goal-card { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--green); border-radius: var(--r); padding: 18px; margin-bottom: 16px; }
    .goal-hdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .goal-title { font-size: 15px; font-weight: 700; color: #fff; }
    .goal-sub { font-size: 12px; color: var(--muted); }
    .goal-est { font-size: 30px; font-weight: 800; color: var(--green); line-height: 1; }
    .goal-target { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .goal-bar-wrap { margin: 12px 0 6px; background: var(--surface2); border-radius: 8px; height: 8px; overflow: hidden; }
    .goal-bar-fill { height: 100%; border-radius: 8px; background: var(--green); transition: width .6s ease; }
    .goal-pct-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .goal-achieved { font-size: 15px; font-weight: 700; color: var(--green); }
    .pace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 680px) { .pace-grid { grid-template-columns: 1fr; } }
    .prog-hist-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--surface2); padding: 9px 16px; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); }
    td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .hl { color: #fff; font-weight: 600; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .type-Easy-Run     { background: rgba(16,185,129,.12); color: #34d399; }
    .type-Long-Run     { background: rgba(124,58,237,.12); color: #a78bfa; }
    .type-Threshold    { background: rgba(245,158,11,.12);  color: #fbbf24; }
    .type-5K-Time-Trial{ background: rgba(239,68,68,.12);   color: #f87171; }
    .hist-actions { white-space: nowrap; text-align: right; }
    .hist-act-btn { background: none; border: none; cursor: pointer; padding: 3px 5px; border-radius: 5px; color: var(--muted); font-size: 13px; line-height: 1; transition: all .15s; }
    .hist-act-btn:hover { background: var(--surface2); color: var(--text); }
    .amrap-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
    .sets-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 8px; }
    .set-row { display: grid; grid-template-columns: 38px 1fr 1fr 44px; gap: 4px; padding: 7px 12px; align-items: center; font-size: 13px; border-top: 1px solid var(--border); }
    .set-wt  { font-weight: 600; color: #fff; }
    .set-reps { color: var(--dim); }
    .set-pct  { color: var(--muted); font-size: 11px; text-align: right; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); width: 100%; max-width: 460px; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; }
    .modal-hdr h3 { font-size: 17px; font-weight: 700; color: #fff; }
    .modal-ftr { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
    .field input, .field select { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px; color: var(--text); font-size: 14px; width: 100%; transition: border-color .15s; }
    .field input:focus { outline: none; border-color: var(--accent); }
    .time-row { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .time-row input { width: 64px; text-align: center; }
    .lg-mode-toggle { display: flex; gap: 6px; }
    .lg-mode-btn { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; text-align: center; }
    .lg-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lg-week-hint { background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.2); border-radius: 7px; padding: 7px 12px; font-size: 12px; color: #c4b5fd; font-weight: 600; margin-bottom: 2px; }
    .lg-set-row { display: grid; grid-template-columns: auto 80px 14px 72px 28px; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .lg-set-row:last-child { border-bottom: none; }
    .lg-set-lbl { font-size: 12px; color: var(--dim); }
    .lg-set-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 7px; color: var(--text); font-size: 14px; text-align: center; width: 100%; }
    .lg-set-input:focus { outline: none; border-color: var(--accent); }
    .lg-x { text-align: center; color: var(--muted); font-size: 13px; }
    .lg-del-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 2px 4px; border-radius: 4px; line-height: 1; transition: all .15s; }
    .lg-del-btn:hover { background: rgba(239,68,68,.15); color: #ef4444; }
    .lg-add-btn { width: 100%; margin-top: 8px; padding: 7px; background: none; border: 1px dashed var(--border); border-radius: 7px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .lg-add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,58,237,.06); }
    .settings-group { border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .settings-group-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); font-weight: 800; }
    .prog-note-banner { background: rgba(124,58,237,.08); border: 1px solid rgba(124,58,237,.2); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--dim); line-height: 1.6; }
    .prog-note-banner strong { color: var(--accent); }
  </style>
</head>
<body>
<div id="app"></div>
<script>

const LIFT_PROGRAM = {
  weekSchemes: [
    { label: "5s Week", sets: [{pct:.65,reps:5}, {pct:.75,reps:5}, {pct:.85,reps:"5+"}] },
    { label: "3s Week", sets: [{pct:.70,reps:3}, {pct:.80,reps:3}, {pct:.90,reps:"3+"}] },
    { label: "1s Week", sets: [{pct:.75,reps:5}, {pct:.85,reps:3}, {pct:.95,reps:"1+"}] },
    { label: "Deload",  sets: [{pct:.40,reps:5}, {pct:.50,reps:5}, {pct:.60,reps:5}]   },
  ],
  schedule: {
    1: { name:"OHP Day", mainLift:"Overhead Press", powerPrimer:{name:"Med Ball Chest Pass / Overhead Slam",sets:4,reps:"5"}, heavyComplement:{name:"Weighted Dips",sets:5,reps:"5"}, circuit:{note:"50 each total",exercises:["Pushups","Pullups","Walking Lunges"]}, groups:[{label:"Arm / Shoulder Tri-Set · 3 rounds",items:[{name:"DB Lateral Raises",reps:"15"},{name:"EZ-Bar Curls",reps:"12"},{name:"Cable Rope Pushdowns",reps:"12"}]},{label:"Grappling Assistance · 3 rounds",items:[{name:"Face Pulls",reps:"15"},{name:"Neck Flexion/Extension",reps:"15"}]}] },
    2: { name:"Deadlift Day", mainLift:"Deadlift", powerPrimer:{name:"Broad Jumps",sets:5,reps:"3"}, heavyComplement:{name:"Front Squat",sets:5,reps:"3"}, circuit:{note:"50 each total",exercises:["Hanging Knee Raises","Inverted Rows","Reverse Lunges"]}, groups:[{label:"Grappling Assistance",items:[{name:"Farmer Carries",sets:4,reps:"45–60 sec"}]},{label:"Optional",items:[{name:"Hammer Curls",sets:3,reps:"12"}]}] },
    4: { name:"Bench Day", mainLift:"Bench Press", powerPrimer:{name:"Power Cleans",sets:5,reps:"3",note:"60–70% of clean max"}, heavyComplement:{name:"Weighted Chinups",sets:5,reps:"5"}, circuit:{note:"50 each total",exercises:["Pushups","Ring Rows","Step-ups"]}, groups:[{label:"Arm / Shoulder Tri-Set · 3 rounds",items:[{name:"Rear Delt Fly",reps:"15"},{name:"Incline DB Curls",reps:"12"},{name:"Overhead Cable Triceps Ext.",reps:"12"}]},{label:"Shoulder Health",items:[{name:"Band External Rotations",sets:3,reps:"20"}]}] },
    5: { name:"Squat Day", mainLift:"Squat", powerPrimer:{name:"Box Jumps",sets:5,reps:"3",note:"Alt some weeks: Hill Sprints 6×8 sec"}, heavyComplement:{name:"Romanian Deadlift",sets:5,reps:"5"}, circuit:{note:"50 each total",exercises:["Air Squats","Hanging Leg Raises","Pullups"]}, groups:[{label:"Grappling Assistance",items:[{name:"Copenhagen Plank",sets:3,reps:"20 sec each side"}]},{label:"Optional",items:[{name:"Tibialis Raises",sets:3,reps:"15"}]}] },
  }
};

const RUN_PROGRAM = {
  days: [0, 3, 4],
  weeks: [
    { 0:{type:"Long Run",dist:4.0,notes:"Slow and steady."}, 3:{type:"Threshold",desc:"1 mi tempo (2 mi total)",notes:"Easy warmup mile → 1 mi at tempo → easy cooldown."}, 4:{type:"Easy Run",dist:2.0,notes:"Fully conversational."} },
    { 0:{type:"Long Run",dist:4.5,notes:"Steady easy effort."}, 3:{type:"Threshold",desc:"1.25 mi tempo (2.5 mi total)",notes:"Easy warmup → 1.25 mi at tempo → cooldown."}, 4:{type:"Easy Run",dist:2.0,notes:"Recovery run."} },
    { 0:{type:"Long Run",dist:5.0,notes:"Stay easy throughout."}, 3:{type:"Threshold",desc:"1.5 mi tempo (3 mi total)",notes:"Warmup → 1.5 mi at tempo → cooldown."}, 4:{type:"Easy Run",dist:2.5,notes:"Easy aerobic run."} },
    { 0:{type:"Long Run",dist:5.0,notes:"Consistent easy effort."}, 3:{type:"Threshold",desc:"2×0.75 mi tempo",notes:"2 min walk between reps."}, 4:{type:"Easy Run",dist:2.0,notes:"Easy recovery run."} },
    { 0:{type:"Long Run",dist:5.5,notes:"Patience is key."}, 3:{type:"Threshold",desc:"2 mi tempo (3 mi total)",notes:"Warmup → 2 mi continuous tempo → cooldown."}, 4:{type:"Easy Run",dist:2.5,notes:"Aerobic base run."} },
    { 0:{type:"Long Run",dist:6.0,notes:"Landmark 6-mile run."}, 3:{type:"Threshold",desc:"2 mi tempo continuous",notes:"2 miles straight at tempo."}, 4:{type:"Easy Run",dist:3.0,notes:"Easy run."} },
    { 0:{type:"Long Run",dist:6.0,notes:"Consolidation week."}, 3:{type:"Threshold",desc:"2×1 mi tempo",notes:"2 min walk recovery between reps."}, 4:{type:"Easy Run",dist:2.5,notes:"Easy recovery run."} },
    { 0:{type:"Long Run",dist:6.5,notes:"New distance PR."}, 3:{type:"Threshold",desc:"2.5 mi tempo (3.5 mi total)",notes:"Warmup → 2.5 mi tempo → cooldown."}, 4:{type:"Easy Run",dist:3.0,notes:"Easy aerobic run."} },
    { 0:{type:"Long Run",dist:7.0,notes:"Peak long run."}, 3:{type:"Threshold",desc:"2 mi + 1 mi tempo",notes:"3 miles of tempo broken up."}, 4:{type:"Easy Run",dist:3.0,notes:"Easy run."} },
    { 0:{type:"Long Run",dist:6.0,notes:"Step-back week."}, 3:{type:"Threshold",desc:"2 mi tempo continuous",notes:"Familiar effort."}, 4:{type:"Easy Run",dist:2.5,notes:"Easy recovery run."} },
    { 0:{type:"Long Run",dist:5.0,notes:"Taper long run."}, 3:{type:"Threshold",desc:"1.5 mi tempo",notes:"Short, sharp taper tempo."}, 4:{type:"Easy Run",dist:2.0,notes:"Easy shakeout."} },
    { 0:{type:"5K Time Trial",desc:"Race it!",notes:"Warm up 10–15 min easy → run your best 5K → cool down."}, 3:{type:"Threshold",desc:"1 mi tempo",notes:"Final tune-up."}, 4:{type:"Easy Run",dist:2.0,notes:"Light shakeout only."} },
  ]
};

const MAIN_LIFTS  = ["Squat", "Bench Press", "Deadlift", "Overhead Press"];
const DAY_NAMES   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const STORAGE_KEY = "wt-v1";

const DEFAULT_STATE = {
  settings: { programStartDate: getLastMonday(), trainingMaxes: { "Squat":225,"Bench Press":155,"Deadlift":275,"Overhead Press":105 } },
  liftLogs: [], runLogs: [],
};

let S = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p=JSON.parse(raw); return {...DEFAULT_STATE,...p,settings:{...DEFAULT_STATE.settings,...p.settings}}; }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }

function getLastMonday(from) {
  const d = from ? new Date(from) : new Date(); d.setHours(12,0,0,0);
  const day = d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1));
  return d.toISOString().split("T")[0];
}
function todayStr()        { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dayOfWeek(ds)     { return new Date(ds+"T12:00:00").getDay(); }
function roundW(w)         { return Math.round(w/5)*5; }
function e1rm(w,r)         { if(!w||!r||r<=0) return 0; return r===1?w:Math.round(w*(1+r/30)); }
function pad(n)            { return String(n).padStart(2,"0"); }
function fmtDur(s)         { if(!s) return "--"; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return h?`${h}:${pad(m)}:${pad(ss)}`:`${m}:${pad(ss)}`; }
function fmtPace(dist,dur) { if(!dist||!dur) return "--"; const s=dur/dist; return `${Math.floor(s/60)}:${pad(Math.round(s%60))}/mi`; }
function fmtDate(d)        { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function fmtDateShort(d)   { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function fmtPaceVal(s)     { return `${Math.floor(s/60)}:${pad(Math.round(s%60))}`; }
function uid()             { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function eid(s)            { return s.replace(/\s+/g,"-"); }

function weekInCycle() {
  const start=new Date(S.settings.programStartDate+"T12:00:00");
  const now=new Date(); now.setHours(12,0,0,0);
  const days=Math.floor((now-start)/86400000);
  return days<0?0:Math.floor(days/7)%LIFT_PROGRAM.weekSchemes.length;
}
function totalWeeks() {
  const start=new Date(S.settings.programStartDate+"T12:00:00");
  const now=new Date(); now.setHours(12,0,0,0);
  const days=Math.floor((now-start)/86400000);
  return days<0?0:Math.floor(days/7);
}
function weekInCycleForDate(ds) {
  const start=new Date(S.settings.programStartDate+"T12:00:00");
  const date=new Date(ds+"T12:00:00");
  const days=Math.floor((date-start)/86400000);
  return days<0?0:Math.floor(days/7)%LIFT_PROGRAM.weekSchemes.length;
}
function totalWeeksToDate(ds) {
  const start=new Date(S.settings.programStartDate+"T12:00:00");
  const date=new Date(ds+"T12:00:00");
  const days=Math.floor((date-start)/86400000);
  return days<0?0:Math.floor(days/7);
}
function mainLiftSets(lift) {
  const tm=S.settings.trainingMaxes[lift]||0;
  return LIFT_PROGRAM.weekSchemes[weekInCycle()].sets.map(s=>({weight:roundW(tm*s.pct),reps:s.reps,pct:s.pct}));
}
function liftToBeat(liftName) {
  const logs=S.liftLogs.filter(l=>l.lift===liftName); if(!logs.length) return null;
  logs.sort((a,b)=>b.date.localeCompare(a.date));
  const last=logs[0], lastTop=last.sets[last.sets.length-1], lastE=e1rm(lastTop.weight,lastTop.reps);
  let bestE=0, bestLog=null;
  for(const log of logs){const top=log.sets[log.sets.length-1],est=e1rm(top.weight,top.reps);if(est>bestE){bestE=est;bestLog=log;}}
  return{last,lastTop,lastE,bestE,bestLog,isPR:last===bestLog};
}
function runForDate(ds) {
  const dow=dayOfWeek(ds); if(!RUN_PROGRAM.days.includes(dow)) return null;
  const wk=Math.min(Math.max(0,totalWeeksToDate(ds)),RUN_PROGRAM.weeks.length-1);
  return RUN_PROGRAM.weeks[wk][dow]||null;
}

// ── Charts ──

function sparkline(vals,color="#7c3aed",w=120,h=36) {
  if(!vals||vals.length<2) return `<span style="font-size:11px;color:var(--muted)">—</span>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const px=i=>(i/(vals.length-1))*(w-6)+3, py=v=>h-3-((v-mn)/rng)*(h-6);
  const pts=vals.map((v,i)=>`${px(i)},${py(v)}`).join(" ");
  const lx=px(vals.length-1),ly=py(vals[vals.length-1]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" opacity=".8"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="${color}"/></svg>`;
}

function svgLine(data,{color="#7c3aed",height=130,invertY=false,fmtY=null}={}) {
  if(!data||data.length<2) return `<div class="no-data">Not enough data yet — keep logging!</div>`;
  const vals=data.map(d=>d.y),mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const PL=46,PR=10,PT=10,PB=26,vW=600,vH=height,W=vW-PL-PR,H=vH-PT-PB;
  const tx=i=>PL+(i/(data.length-1))*W, ty=v=>invertY?PT+((v-mn)/rng)*H:PT+H-((v-mn)/rng)*H;
  const pts=data.map((d,i)=>`${tx(i)},${ty(d.y)}`).join(" ");
  const grid=[mn,(mn+mx)/2,mx].map(v=>{const y=ty(v),lbl=fmtY?fmtY(v):Math.round(v);return `<line x1="${PL}" y1="${y}" x2="${PL+W}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${PL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="system-ui">${lbl}</text>`;}).join("");
  const step=Math.max(1,Math.ceil(data.length/7));
  const xLbls=data.map((d,i)=>i%step===0?`<text x="${tx(i)}" y="${vH-2}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">${d.label||""}</text>`:"").join("");
  const dots=data.map((d,i)=>`<circle cx="${tx(i)}" cy="${ty(d.y)}" r="3" fill="${color}" opacity=".9"/>`).join("");
  const lastX=tx(data.length-1),baseY=ty(invertY?mx:mn);
  const area=`<polygon points="${PL},${baseY} ${pts} ${lastX},${baseY}" fill="${color}" opacity=".07"/>`;
  return `<svg viewBox="0 0 ${vW} ${vH}" style="width:100%;height:${vH}px;display:block">${grid}${area}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${dots}${xLbls}</svg>`;
}

function svgBar(data,{color="#10b981",height=130}={}) {
  if(!data||!data.length) return `<div class="no-data">No data yet</div>`;
  const maxY=Math.max(...data.map(d=>d.y),1);
  const PL=42,PR=10,PT=10,PB=26,vW=600,vH=height,W=vW-PL-PR,H=vH-PT-PB;
  const slotW=W/data.length,barW=Math.max(3,slotW-4);
  const bars=data.map((d,i)=>{const bh=(d.y/maxY)*H,x=PL+i*slotW+(slotW-barW)/2,y=PT+H-bh;return d.y>0?`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${color}" rx="2"/>`:`<rect x="${x}" y="${PT+H-2}" width="${barW}" height="2" fill="${color}" opacity=".15" rx="1"/>`;}).join("");
  const grid=[0,maxY/2,maxY].map(v=>{const y=PT+H-(v/maxY)*H;return `<line x1="${PL}" y1="${y}" x2="${PL+W}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${PL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="system-ui">${Math.round(v)}</text>`;}).join("");
  const step=Math.max(1,Math.ceil(data.length/7));
  const xLbls=data.map((d,i)=>i%step===0?`<text x="${PL+i*slotW+slotW/2}" y="${vH-2}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">${d.label||""}</text>`:"").join("");
  return `<svg viewBox="0 0 ${vW} ${vH}" style="width:100%;height:${vH}px;display:block">${grid}${bars}${xLbls}</svg>`;
}

// ── Progress data helpers ──

function liftE1rmHistory(lift,n=12) {
  return S.liftLogs.filter(l=>l.lift===lift).sort((a,b)=>a.date.localeCompare(b.date)).slice(-n)
    .map(log=>({label:fmtDateShort(log.date),y:e1rm(log.sets[log.sets.length-1].weight,log.sets[log.sets.length-1].reps)}));
}
function liftBest(lift) {
  let bestE=0,bestSet=null,bestDate=null;
  for(const log of S.liftLogs.filter(l=>l.lift===lift))
    for(const s of log.sets){const e=e1rm(s.weight,s.reps);if(e>bestE){bestE=e;bestSet=s;bestDate=log.date;}}
  return bestE?{e1rm:bestE,set:bestSet,date:bestDate}:null;
}
function weeklyMileage(numWeeks=12) {
  const today=new Date();today.setHours(12,0,0,0);
  const dow=today.getDay(),mon0=new Date(today);mon0.setDate(today.getDate()-(dow===0?6:dow-1));mon0.setHours(0,0,0,0);
  const weeks=[];
  for(let w=numWeeks-1;w>=0;w--){
    const mon=new Date(mon0);mon.setDate(mon0.getDate()-w*7);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
    const miles=S.runLogs.filter(l=>{const d=new Date(l.date+"T12:00:00");return d>=mon&&d<=sun;}).reduce((s,l)=>s+(l.distance||0),0);
    weeks.push({label:mon.toLocaleDateString("en-US",{month:"short",day:"numeric"}),y:Math.round(miles*10)/10});
  }
  return weeks;
}
function paceHistory(type,n=12) {
  return S.runLogs.filter(l=>l.type===type&&l.distance>0&&l.duration>0)
    .sort((a,b)=>a.date.localeCompare(b.date)).slice(-n)
    .map(l=>({label:fmtDateShort(l.date),y:l.duration/l.distance}));
}
function best5K() {
  const runs=S.runLogs.filter(l=>l.distance>=0.5&&l.duration>0);
  if(!runs.length) return null;
  const bestPace=Math.min(...runs.map(l=>l.duration/l.distance));
  const secs=Math.round(bestPace*3.107),pct=Math.min(100,Math.round(1800/secs*100));
  return{pace:bestPace,secs,pct};
}
function runStatsRow() {
  const totalMiles=S.runLogs.reduce((s,l)=>s+(l.distance||0),0);
  const today=new Date();today.setHours(12,0,0,0);
  const dow=today.getDay(),mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));mon.setHours(0,0,0,0);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  const weekMiles=S.runLogs.filter(l=>{const d=new Date(l.date+"T12:00:00");return d>=mon&&d<=sun;}).reduce((s,l)=>s+(l.distance||0),0);
  const runs=S.runLogs.filter(l=>l.distance>0&&l.duration>0);
  const bestPace=runs.length?Math.min(...runs.map(l=>l.duration/l.distance)):0;
  return{totalMiles:Math.round(totalMiles*10)/10,weekMiles:Math.round(weekMiles*10)/10,bestPace,total:S.runLogs.length};
}

function setToBeatHtml() {
  const today=todayStr(),dow=dayOfWeek(today);
  let liftDay=LIFT_PROGRAM.schedule[dow],label="Today";
  if(!liftDay){for(let i=1;i<=7;i++){const d=(dow+i)%7;if(LIFT_PROGRAM.schedule[d]){liftDay=LIFT_PROGRAM.schedule[d];label=`${DAY_NAMES[d]} (next lift)`;break;}}}
  if(!liftDay) return "";
  const wi=weekInCycle(),ws=LIFT_PROGRAM.weekSchemes[wi];
  const lift=liftDay.mainLift,tm=S.settings.trainingMaxes[lift]||0;
  const isDeload=wi===3,sets=ws.sets.map(s=>({weight:roundW(tm*s.pct),reps:s.reps,pct:s.pct}));
  const lastLog=S.liftLogs.filter(l=>l.lift===lift).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  const lastTop=lastLog?.sets[lastLog.sets.length-1],lastE=lastTop?e1rm(lastTop.weight,lastTop.reps):0;
  const setsHtml=sets.map((s,i)=>{const isTop=!isDeload&&i===sets.length-1;const rLbl=isTop?`<span class="amrap-badge">AMRAP</span>${String(s.reps).replace("+","")}+`:s.reps;return `<div class="stb-set${isTop?" top":""}"><span class="stb-set-w">${s.weight} lbs</span><span class="stb-set-r">${rLbl}</span><span class="stb-set-pct">${Math.round(s.pct*100)}%</span></div>`;}).join("");
  const beatHtml=lastTop?`<div class="stb-beat-box"><div class="stb-beat-lbl">🎯 Set to Beat</div><div class="stb-beat-val">${lastTop.weight} lbs × ${lastTop.reps} reps</div><div class="stb-beat-e1rm">e1RM: ${lastE} lbs</div><div class="stb-beat-date">${fmtDate(lastLog.date)}</div></div>`:`<div class="stb-beat-box empty"><div class="stb-beat-lbl">🎯 Set to Beat</div><div class="stb-beat-e1rm" style="margin-top:6px">Log your first ${lift} session to start tracking</div></div>`;
  return `<div class="stb"><div class="stb-row"><div class="stb-day">${label} — ${liftDay.name}</div><div class="stb-scheme-badge">Week ${wi+1} · ${ws.label}</div></div><div class="stb-lift">${lift}</div><div class="stb-body"><div><div class="stb-sets-lbl">Prescribed Sets</div>${setsHtml}</div><div>${beatHtml}</div></div></div>`;
}

function liftPRCard(lift) {
  const logs=S.liftLogs.filter(l=>l.lift===lift).sort((a,b)=>b.date.localeCompare(a.date));
  const tm=S.settings.trainingMaxes[lift]||0;
  if(!logs.length) return `<div class="pr-card"><div class="pr-card-hdr"><div class="pr-lift">${lift}</div><div class="pr-tm">TM: ${tm} lbs</div></div><div class="pr-empty-msg">No sessions logged yet</div></div>`;
  const best=liftBest(lift),sparkVals=liftE1rmHistory(lift,10).map(d=>d.y),recent=logs.slice(0,5);
  return `<div class="pr-card"><div class="pr-card-hdr"><div class="pr-lift">${lift}</div><div class="pr-tm">TM: ${tm} lbs</div></div><div><div class="pr-best-lbl">Best e1RM</div><div class="pr-best-e1rm">${best.e1rm} <span style="font-size:14px;color:var(--muted)">lbs</span></div><div class="pr-best-set">${best.set.weight}×${best.set.reps} · ${fmtDate(best.date)}</div></div><div class="pr-spark-row">${sparkline(sparkVals,"#7c3aed",120,36)}<div class="pr-spark-lbl">last ${sparkVals.length} sessions<br><span style="color:var(--accent);font-weight:600">e1RM trend</span></div></div><div class="pr-hist"><div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;display:grid;grid-template-columns:90px 1fr 52px;gap:6px"><span>Date</span><span>Sets</span><span style="text-align:right">e1RM</span></div>${recent.map(log=>{const top=log.sets[log.sets.length-1],e=e1rm(top.weight,top.reps),setStr=log.sets.map(s=>`${s.weight}×${s.reps}`).join(", ");return `<div class="pr-hist-row"><span class="pr-hist-date">${fmtDateShort(log.date)}</span><span class="pr-hist-sets">${setStr}</span><span class="pr-hist-e">${e}</span></div>`;}).join("")}</div></div>`;
}

function runningTab() {
  const st=runStatsRow(),goal=best5K(),weekData=weeklyMileage(12);
  const runTypes=[...new Set(S.runLogs.map(l=>l.type).filter(Boolean))];
  const statsHtml=`<div class="stats-row"><div class="stat-card"><div class="stat-lbl">Total Miles</div><div class="stat-val">${st.totalMiles}</div><div class="stat-sub">all time</div></div><div class="stat-card"><div class="stat-lbl">This Week</div><div class="stat-val">${st.weekMiles}</div><div class="stat-sub">miles</div></div><div class="stat-card"><div class="stat-lbl">Best Pace</div><div class="stat-val" style="font-size:18px">${st.bestPace?fmtPaceVal(st.bestPace)+'<span style="font-size:11px;color:var(--muted)">/mi</span>':"—"}</div><div class="stat-sub">any run</div></div><div class="stat-card"><div class="stat-lbl">Runs Logged</div><div class="stat-val">${st.total}</div><div class="stat-sub">total sessions</div></div></div>`;
  const mileageChart=`<div class="chart-section"><div class="chart-hdr"><div class="chart-title">Weekly Mileage</div><div class="chart-sub">last 12 weeks</div></div><div class="chart-wrap">${svgBar(weekData,{color:"#10b981",height:140})}</div></div>`;
  let paceChartsHtml="";
  if(runTypes.length){paceChartsHtml=`<div class="pace-grid">${runTypes.map(type=>`<div class="chart-section" style="margin-bottom:0"><div class="chart-hdr"><div class="chart-title">${type} — Pace Trend</div><div class="chart-sub">lower = faster</div></div><div class="chart-wrap">${svgLine(paceHistory(type,12),{color:type==="Long Run"?"#a78bfa":type==="Threshold"?"#f59e0b":"#10b981",height:120,invertY:true,fmtY:fmtPaceVal})}</div></div>`).join("")}</div>`;}
  let goalHtml="";
  if(goal){const achieved=goal.secs<=1800;goalHtml=`<div class="goal-card"><div class="goal-hdr"><div class="goal-title">🏁 Sub-30 5K Goal</div><div class="goal-sub">Target: 30:00</div></div><div class="goal-est">${fmtDur(goal.secs)}</div><div class="goal-target">Estimated 5K · best pace ${fmtPaceVal(goal.pace)}/mi</div><div class="goal-bar-wrap"><div class="goal-bar-fill" style="width:${goal.pct}%"></div></div><div class="goal-pct-row"><span>${goal.pct}% of goal pace</span>${achieved?`<span class="goal-achieved">✓ Goal achieved!</span>`:`<span>${fmtDur(goal.secs-1800)} over target</span>`}</div></div>`;}
  else if(!S.runLogs.length){goalHtml=`<div class="chart-section"><div class="no-data">Log some runs to see your 5K goal progress</div></div>`;}
  const runRows=[...S.runLogs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  const tableHtml=runRows.length?`<div class="prog-hist-card"><table><thead><tr><th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Pace</th><th></th></tr></thead><tbody>${runRows.map(l=>`<tr><td>${fmtDate(l.date)}</td><td><span class="type-badge type-${(l.type||'').replace(/\s+/g,"-")}">${l.type||'—'}</span></td><td>${l.distance} mi</td><td class="hl">${fmtDur(l.duration)}</td><td>${fmtPace(l.distance,l.duration)}</td><td style="white-space:nowrap"><button class="hist-act-btn" onclick="editRunLog('${l.id}')">✏️</button><button class="hist-act-btn" onclick="deleteRunLog('${l.id}')">🗑️</button></td></tr>`).join("")}</tbody></table></div>`:"";
  return `${statsHtml}${mileageChart}${paceChartsHtml}${goalHtml}${tableHtml}`;
}

  ${modalsHtml()}`;
}

function switchProgTab(i) {
  progTab = i;
  document.querySelectorAll(".t-btn").forEach((b,j)=>b.classList.toggle("active",i===j));
  document.getElementById("prog-tab-content").innerHTML = i===0?liftsTab():runningTab();
}

// ── Logger actions ──

function openSettings() { document.getElementById("ov-settings").classList.add("open"); }
function closeOv(id)    { document.getElementById(id).classList.remove("open"); }

function openLogger(opts={}) {
  logCtx={mode:opts.mode||'lift',date:opts.date||todayStr(),lift:opts.lift||'Squat',type:opts.type||'',editId:opts.editId||null};
  document.querySelector('#ov-logger h3').textContent=logCtx.editId?'Edit Workout':'Log Workout';
  document.getElementById('lg-date').value=logCtx.date;
  const liftSel=document.getElementById('lg-lift');
  liftSel.value=MAIN_LIFTS.includes(logCtx.lift)?logCtx.lift:'__custom__';
  if(!MAIN_LIFTS.includes(logCtx.lift)&&logCtx.lift) document.getElementById('lg-custom-name').value=logCtx.lift;
  document.getElementById('lg-run-type').value=logCtx.type||'';
  document.getElementById('lg-notes').value=opts.notes||'';
  document.getElementById('lg-run-notes').value=opts.runNotes||'';
  document.getElementById('lg-run-dist').value=opts.dist||'';
  const dur=opts.duration||0;
  document.getElementById('lg-run-h').value=dur?(Math.floor(dur/3600)||''):'';
  document.getElementById('lg-run-m').value=dur?(Math.floor((dur%3600)/60)||''):'';
  document.getElementById('lg-run-s').value=dur?(dur%60||''):'';
  setLogMode(logCtx.mode);
  if(opts.editSets){lgSets=opts.editSets.map(s=>({weight:s.weight,reps:s.reps}));document.getElementById('lg-custom-name-wrap').style.display=MAIN_LIFTS.includes(logCtx.lift)?'none':'';document.getElementById('lg-week-hint').innerHTML=`<div class="lg-week-hint">Editing logged session</div>`;renderSetRows();}
  else{refreshSetRows();}
  document.getElementById('ov-logger').classList.add('open');
}

function setLogMode(mode) {
  logCtx.mode=mode;
  document.querySelectorAll('.lg-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  document.getElementById('lg-lift-panel').style.display=mode==='lift'?'':'none';
  document.getElementById('lg-run-panel').style.display=mode==='run'?'':'none';
  document.getElementById('lg-save-btn').textContent=mode==='lift'?'Save Lift':'Save Run';
}

function onLogDateChange() { refreshSetRows(); }
function onLogLiftChange() { refreshSetRows(); }

function refreshSetRows() {
  const lift=document.getElementById('lg-lift').value,date=document.getElementById('lg-date').value||todayStr(),isCustom=lift==='__custom__';
  document.getElementById('lg-custom-name-wrap').style.display=isCustom?'':'none';
  if(!isCustom){
    const wi=weekInCycleForDate(date),ws=LIFT_PROGRAM.weekSchemes[wi],tm=S.settings.trainingMaxes[lift]||0,isDeload=wi===3;
    lgSets=ws.sets.map((s,i)=>({weight:roundW(tm*s.pct),reps:typeof s.reps==='number'?s.reps:String(s.reps).replace('+',''),pct:s.pct,isAmrap:!isDeload&&i===ws.sets.length-1}));
    document.getElementById('lg-week-hint').innerHTML=tm?`<div class="lg-week-hint">Week ${wi+1} · ${ws.label} · TM: ${tm} lbs</div>`:'';
  } else {
    lgSets=[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}];
    document.getElementById('lg-week-hint').innerHTML='';
  }
  renderSetRows();
}

function renderSetRows() {
  document.getElementById('lg-sets-body').innerHTML=lgSets.map((s,i)=>{
    const lbl=s.isAmrap?`<span class="amrap-badge">AMRAP</span>${s.pct?Math.round(s.pct*100)+'%':''}`:`Set ${i+1}${s.pct?' · '+Math.round(s.pct*100)+'%':''}`;
    return `<div class="lg-set-row"><span class="lg-set-lbl">${lbl}</span><input type="number" id="lgw-${i}" class="lg-set-input" value="${s.weight}" placeholder="lbs"><span class="lg-x">×</span><input type="number" id="lgr-${i}" class="lg-set-input" value="${s.reps}" placeholder="reps"><button class="lg-del-btn" onclick="removeSetRow(${i})">×</button></div>`;
  }).join('');
}

function syncSetValues() { lgSets.forEach((_,i)=>{const w=document.getElementById(`lgw-${i}`),r=document.getElementById(`lgr-${i}`);if(w)lgSets[i].weight=w.value;if(r)lgSets[i].reps=r.value;}); }
function addSetRow() { syncSetValues();lgSets.push({weight:'',reps:''});renderSetRows();setTimeout(()=>{const els=document.querySelectorAll('.lg-set-input');if(els.length)els[els.length-2].focus();},50); }
function removeSetRow(i) { if(lgSets.length<=1)return;syncSetValues();lgSets.splice(i,1);renderSetRows(); }

function saveWorkout() {
  const date=document.getElementById('lg-date').value||todayStr();
  if(logCtx.mode==='lift'){
    const sel=document.getElementById('lg-lift').value,isCustom=sel==='__custom__';
    const liftName=isCustom?(document.getElementById('lg-custom-name').value.trim()||'Custom'):sel;
    const notes=document.getElementById('lg-notes').value.trim();
    const sets=lgSets.map((_,i)=>({weight:parseInt(document.getElementById(`lgw-${i}`)?.value)||0,reps:parseInt(document.getElementById(`lgr-${i}`)?.value)||0})).filter(s=>s.weight>0&&s.reps>0);
    if(!sets.length)return;
    if(logCtx.editId){const idx=S.liftLogs.findIndex(l=>l.id===logCtx.editId);if(idx>=0)S.liftLogs[idx]={...S.liftLogs[idx],date,lift:liftName,sets,notes};}
    else{S.liftLogs.push({id:uid(),date,lift:liftName,workout:liftName,sets,notes});}
  } else {
    const type=document.getElementById('lg-run-type').value.trim();
    const distance=parseFloat(document.getElementById('lg-run-dist').value);
    const h=parseInt(document.getElementById('lg-run-h').value)||0,m=parseInt(document.getElementById('lg-run-m').value)||0,s=parseInt(document.getElementById('lg-run-s').value)||0;
    const duration=h*3600+m*60+s,notes=document.getElementById('lg-run-notes').value.trim();
    if(!type||!distance||!duration)return;
    if(logCtx.editId){const idx=S.runLogs.findIndex(l=>l.id===logCtx.editId);if(idx>=0)S.runLogs[idx]={...S.runLogs[idx],date,type,distance,duration,notes};}
    else{S.runLogs.push({id:uid(),date,type,distance,duration,notes});}
  }
  saveState();closeOv('ov-logger');render();switchProgTab(progTab);
}

function editRunLog(id) { const log=S.runLogs.find(l=>l.id===id);if(!log)return;openLogger({mode:'run',date:log.date,type:log.type,editId:id,dist:log.distance,duration:log.duration,runNotes:log.notes||''}); }
function deleteRunLog(id) { if(!confirm('Delete this run?'))return;S.runLogs=S.runLogs.filter(l=>l.id!==id);saveState();render();switchProgTab(progTab); }
function editLiftLog(id) { const log=S.liftLogs.find(l=>l.id===id);if(!log)return;openLogger({mode:'lift',date:log.date,lift:log.lift,editId:id,notes:log.notes||'',editSets:log.sets}); }
function deleteLiftLog(id) { if(!confirm('Delete this session?'))return;S.liftLogs=S.liftLogs.filter(l=>l.id!==id);saveState();render();switchProgTab(progTab); }

function saveSettings() {
  MAIN_LIFTS.forEach(l=>{const v=parseInt(document.getElementById(`tm-${eid(l)}`).value);if(v>0)S.settings.trainingMaxes[l]=v;});
  const d=document.getElementById("prog-start").value;if(d)S.settings.programStartDate=d;
  saveState();closeOv("ov-settings");render();
}

document.addEventListener("click",e=>{if(e.target.classList.contains("overlay"))e.target.classList.remove("open");});

// ── Boot ──
const _p = new URLSearchParams(window.location.search);
const _tab = _p.get('tab');
if(_tab!==null) progTab = parseInt(_tab);
render();
</script>
</body>
