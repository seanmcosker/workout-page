<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #0d0d14;
      --surface: #13131e;
      --surface2: #1b1b2e;
      --border: #24243c;
      --accent: #7c3aed;
      --accent-h: #6d28d9;
      --green: #10b981;
      --green-h: #059669;
      --text: #e2e8f0;
      --dim: #94a3b8;
      --muted: #4a5570;
      --yellow: #f59e0b;
      --red: #ef4444;
      --r: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }
    #app { max-width: 1080px; margin: 0 auto; padding: 0 16px 80px; }

    /* ── Header ── */
    /* ── Sticky nav ── */
    /* ── Page nav (cross-page links) ── */
    .page-nav { display: flex; align-items: center; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 0; }
    .pnav-a { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; transition: all .15s; }
    .pnav-a:hover { background: var(--surface2); color: var(--text); }
    .pnav-a.cur { background: var(--surface2); color: var(--accent); }
    .pnav-sep { color: var(--border); font-size: 16px; }

    /* ── Sticky section nav (within-page) ── */
    .sticky-nav { position: sticky; top: 0; z-index: 50; background: rgba(13,13,20,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; gap: 2px; padding: 0 16px; margin: 0 -16px 24px; }
    .snav-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 14px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; transition: all .15s; margin-bottom: -1px; }
    .snav-btn:hover { color: var(--text); }
    .snav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .hdr { display: flex; justify-content: space-between; align-items: flex-start; padding: 24px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; gap: 12px; }
    .hdr h1 { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .hdr-date { font-size: 13px; color: var(--dim); margin-top: 2px; }
    .hdr-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .week-badge { background: var(--surface2); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-green { background: var(--green); color: #fff; }
    .btn-green:hover { background: var(--green-h); }
    .btn-ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .log-btn { margin-top: auto; width: 100%; }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 18px; padding: 6px 8px; border-radius: 6px; color: var(--dim); transition: background .15s; }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }
    .close-btn { background: none; border: none; cursor: pointer; font-size: 24px; color: var(--muted); line-height: 1; padding: 0 2px; transition: color .15s; }
    .close-btn:hover { color: var(--text); }

    /* ── Section headings ── */
    .sec-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 14px; }

    /* ── Today cards ── */
    .today-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 680px) { .today-cards { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 0; }
    .card-lift { border-top: 3px solid var(--accent); }
    .card-run  { border-top: 3px solid var(--green); }
    .card-rest { border-top: 3px solid var(--border); opacity: .65; }

    .card-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .card-icon { font-size: 26px; line-height: 1; }
    .card-title { font-size: 17px; font-weight: 700; color: #fff; }
    .card-sub { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 1px; }

    /* ── Program blocks (within lift card) ── */
    .prog-block { padding: 12px 0; border-top: 1px solid var(--border); }
    .prog-block:first-of-type { border-top: none; }
    .prog-block-label {
      font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.8px;
      color: var(--muted); margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center;
    }
    .prog-block-label span { font-weight: 500; letter-spacing: .5px; color: var(--muted); opacity: .7; text-transform: none; font-size: 11px; }
    .prog-single { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .prog-single-detail { color: var(--muted); font-size: 12px; }
    .prog-note { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 3px; }
    .prog-circuit { font-size: 13px; color: var(--dim); }
    .prog-acc { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; border-bottom: 1px solid rgba(36,36,60,.6); }
    .prog-acc:last-child { border-bottom: none; }
    .prog-acc-detail { color: var(--muted); font-size: 12px; }

    /* ── Lift to Beat ── */
    .ltb { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; margin-top: 8px; }
    .ltb.empty { opacity: .55; }
    .ltb-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--yellow); font-weight: 800; margin-bottom: 3px; }
    .ltb-value { font-size: 18px; font-weight: 700; color: #fff; }
    .ltb-meta  { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .ltb-empty { font-size: 13px; color: var(--muted); font-style: italic; }
    .pr-chip { display: inline-block; background: rgba(245,158,11,.15); color: var(--yellow); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }

    /* ── Sets table ── */
    .main-lift-name { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
    .sets-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-top: 8px; }
    .sets-hdr, .set-row { display: grid; grid-template-columns: 38px 1fr 1fr 44px; gap: 4px; padding: 7px 12px; align-items: center; font-size: 13px; }
    .sets-hdr { background: var(--surface2); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }
    .set-row { border-top: 1px solid var(--border); transition: background .12s; }
    .set-row:hover { background: var(--surface2); }
    .set-row.amrap-row { background: rgba(124,58,237,.07); }
    .set-row.amrap-row:hover { background: rgba(124,58,237,.12); }
    .set-num { color: var(--muted); font-size: 12px; }
    .set-wt  { font-weight: 600; color: #fff; }
    .set-reps { color: var(--dim); font-size: 13px; }
    .set-pct  { color: var(--muted); font-size: 11px; text-align: right; }
    .amrap-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }

    /* ── Log button within card ── */
    .log-btn { margin-top: 16px; width: 100%; }

    /* ── Run card ── */
    .run-target { display: flex; gap: 20px; align-items: flex-end; padding: 12px 0; border-top: 1px solid var(--border); margin-top: 0; }
    .run-stat-v { font-size: 30px; font-weight: 800; color: var(--green); line-height: 1; }
    .run-stat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
    .run-notes { font-size: 13px; color: var(--dim); font-style: italic; border-left: 3px solid var(--green); padding-left: 10px; margin-bottom: 4px; }
    .run-speed-block { padding: 10px 0; border-top: 1px solid var(--border); }
    .run-speed-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); margin-bottom: 6px; }
    .run-speed-desc { font-size: 20px; font-weight: 800; color: var(--yellow); }
    .run-speed-notes { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .last-run { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; margin-top: 4px; }
    .last-run.empty { opacity: .55; }

    /* ── Rest card ── */
    .rest-body { color: var(--muted); font-size: 13px; padding: 8px 0; border-top: 1px solid var(--border); margin-top: 0; }
    .next-up { margin-top: 6px; font-size: 12px; color: var(--dim); }

    /* ── History ── */
    .history-sec { margin-top: 40px; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab { background: none; border: none; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: all .15s; }
    .tab:hover { color: var(--dim); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .hist-wrap { background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--r) var(--r); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--surface2); padding: 9px 16px; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); }
    td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    .hl { color: #fff; font-weight: 600; }
    .empty-hist { padding: 48px 24px; text-align: center; color: var(--muted); }
    .empty-hist p:last-child { font-size: 12px; margin-top: 6px; opacity: .6; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .type-Easy-Run     { background: rgba(16,185,129,.12); color: #34d399; }
    .type-Long-Run     { background: rgba(124,58,237,.12); color: #a78bfa; }
    .type-Threshold    { background: rgba(245,158,11,.12);  color: #fbbf24; }
    .type-5K-Time-Trial{ background: rgba(239,68,68,.12);   color: #f87171; }
    /* legacy */
    .type-Zone-2 { background: rgba(16,185,129,.12); color: #34d399; }
    .type-Speed  { background: rgba(245,158,11,.12); color: #fbbf24; }
    .type-Tempo  { background: rgba(124,58,237,.12); color: #a78bfa; }
    /* history action buttons */
    .hist-actions { white-space: nowrap; text-align: right; }
    .hist-act-btn { background: none; border: none; cursor: pointer; padding: 3px 5px; border-radius: 5px; color: var(--muted); font-size: 13px; line-height: 1; transition: all .15s; }
    .hist-act-btn:hover { background: var(--surface2); color: var(--text); }

    /* ── Modal ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); width: 100%; max-width: 460px; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: 90vh; overflow-y: auto; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; }
    .modal-hdr h3 { font-size: 17px; font-weight: 700; color: #fff; }
    .modal-ftr { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

    /* ── Forms ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
    .field input, .field select { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px; color: var(--text); font-size: 14px; width: 100%; transition: border-color .15s; }
    .field input:focus { outline: none; border-color: var(--accent); }
    .time-row { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .time-row input { width: 64px; text-align: center; }
    .log-set-row { display: grid; grid-template-columns: 1fr 90px 16px 72px; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .log-set-row:last-child { border-bottom: none; }
    .log-set-lbl { font-size: 13px; color: var(--dim); }
    .log-x { text-align: center; color: var(--muted); font-size: 13px; }
    .log-set-row input { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 7px; color: var(--text); font-size: 14px; text-align: center; width: 100%; }
    .log-set-row input:focus { outline: none; border-color: var(--accent); }
    .settings-group { border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .settings-group-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); font-weight: 800; }
    .prog-note-banner { background: rgba(124,58,237,.08); border: 1px solid rgba(124,58,237,.2); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--dim); line-height: 1.6; }
    .prog-note-banner strong { color: var(--accent); }

    /* ── Unified log modal ── */
    .lg-mode-toggle { display: flex; gap: 6px; }
    .lg-mode-btn { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; text-align: center; }
    .lg-mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lg-week-hint { background: rgba(124,58,237,.1); border: 1px solid rgba(124,58,237,.2); border-radius: 7px; padding: 7px 12px; font-size: 12px; color: #c4b5fd; font-weight: 600; margin-bottom: 2px; }
    .lg-set-row { display: grid; grid-template-columns: auto 80px 14px 72px 28px; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .lg-set-row:last-child { border-bottom: none; }
    .lg-set-lbl { font-size: 12px; color: var(--dim); }
    .lg-set-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 7px; color: var(--text); font-size: 14px; text-align: center; width: 100%; }
    .lg-set-input:focus { outline: none; border-color: var(--accent); }
    .lg-x { text-align: center; color: var(--muted); font-size: 13px; }
    .lg-del-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 2px 4px; border-radius: 4px; line-height: 1; transition: all .15s; }
    .lg-del-btn:hover { background: rgba(239,68,68,.15); color: #ef4444; }
    .lg-add-btn { width: 100%; margin-top: 8px; padding: 7px; background: none; border: 1px dashed var(--border); border-radius: 7px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
    .lg-add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,58,237,.06); }
    .btn-log { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s; white-space: nowrap; }
    .btn-log:hover { background: var(--accent-h); }

    /* ── Calendar ── */
    .cal-sec { margin-top: 32px; }
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cal-nav-btn { background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--dim); font-size: 18px; cursor: pointer; padding: 3px 10px; line-height: 1.4; transition: all .15s; }
    .cal-nav-btn:hover { background: var(--surface2); color: var(--text); }
    .cal-month-lbl { font-size: 15px; font-weight: 700; color: #fff; }
    .cal-dow-row { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 3px; }
    .cal-dow { text-align: center; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); padding: 4px 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cal-cell { min-height: 68px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 6px 5px 4px; display: flex; flex-direction: column; gap: 2px; position: relative; transition: border-color .15s; }
    .cal-cell:hover { border-color: var(--muted); }
    .cal-cell.empty { background: transparent; border-color: transparent; pointer-events: none; }
    .cal-cell.cal-today { border-color: var(--accent); background: rgba(124,58,237,.07); }
    .cal-cell.cal-past { opacity: .5; }
    .cal-num { font-size: 12px; font-weight: 600; color: var(--dim); line-height: 1; margin-bottom: 1px; display: flex; justify-content: space-between; align-items: flex-start; }
    .cal-num-today { color: var(--accent); font-weight: 800; }
    .cal-scheme { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); opacity: .7; }
    .cal-tag { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
    .cal-tag-lift  { background: rgba(124,58,237,.18); color: #c4b5fd; }
    .cal-tag-easy  { background: rgba(16,185,129,.18);  color: #6ee7b7; }
    .cal-tag-long  { background: rgba(124,58,237,.18);  color: #c4b5fd; }
    .cal-tag-thresh{ background: rgba(245,158,11,.18);  color: #fcd34d; }
    .cal-logged { position: absolute; top: 5px; right: 5px; font-size: 10px; color: var(--green); font-weight: 800; }
    .cal-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    .cal-cell:not(.empty) { cursor: pointer; }

    /* ── Day detail modal ── */
    .day-modal-date { font-size: 18px; font-weight: 800; color: #fff; }
    .day-modal-week { display: inline-block; background: var(--surface2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--accent); margin-top: 4px; }
    .day-section { padding: 12px 0; border-top: 1px solid var(--border); }
    .day-section-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .day-single { display: flex; justify-content: space-between; font-size: 13px; }
    .day-single-detail { color: var(--muted); font-size: 12px; }
    .day-note { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 2px; }
    .day-circuit { font-size: 13px; color: var(--dim); }
    .day-acc { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid rgba(36,36,60,.5); }
    .day-acc:last-child { border-bottom: none; }
    .day-acc-d { color: var(--muted); font-size: 12px; }
    .day-run-type { font-size: 22px; font-weight: 800; color: var(--green); }
    .day-run-target { font-size: 13px; color: var(--dim); margin-top: 2px; }
    .day-rest { color: var(--muted); font-size: 13px; font-style: italic; }

    /* ── Progress view ── */
    .tab-strip { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .t-btn { background: none; border: none; padding: 9px 18px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
    .t-btn:hover { color: var(--dim); }
    .t-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
    @media (max-width: 620px) { .stats-row { grid-template-columns: repeat(2,1fr); } }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
    .stat-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); margin-bottom: 6px; }
    .stat-val { font-size: 22px; font-weight: 800; color: #fff; line-height: 1; }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .stb { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: var(--r); padding: 20px; margin-bottom: 28px; }
    .stb-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

<div id="app"></div>

<script>
// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════

// JS day-of-week: 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
const LIFT_PROGRAM = {

      ],

};

// Running: Sun = Long Run, Wed = Threshold, Thu = Easy Run
// 12-week progressive plan targeting 5K improvement from ~14 min/mi baseline
const RUN_PROGRAM = {
  days: [0, 3, 4], // 0=Sun (Long), 3=Wed (Threshold), 4=Thu (Easy)
  weeks: [
    // Week 1
    { 0:{ type:"Long Run",     dist:4.0,   notes:"Slow and steady. Find your comfortable long-run pace — fully conversational." },
      3:{ type:"Threshold",    desc:"1 mi tempo (2 mi total)", notes:"Easy warmup mile → 1 mi at tempo (comfortably hard, can say a few words) → easy cooldown mile." },
      4:{ type:"Easy Run",     dist:2.0,   notes:"Fully conversational the whole way. 14 min/mi or slower is perfect." } },
    // Week 2
    { 0:{ type:"Long Run",     dist:4.5,   notes:"Steady easy effort. Don't push the pace — just cover the distance." },
      3:{ type:"Threshold",    desc:"1.25 mi tempo (2.5 mi total)", notes:"Easy warmup → 1.25 mi at tempo effort → cooldown. Keep the tempo portion consistent." },
      4:{ type:"Easy Run",     dist:2.0,   notes:"Recovery run. Keep it easy." } },
    // Week 3
    { 0:{ type:"Long Run",     dist:5.0,   notes:"Stay easy throughout. Run by feel, not by pace." },
      3:{ type:"Threshold",    desc:"1.5 mi tempo (3 mi total)", notes:"Warmup mile → 1.5 mi at tempo → cooldown. Working hard but in control." },
      4:{ type:"Easy Run",     dist:2.5,   notes:"Easy aerobic run. Comfortable breathing throughout." } },
    // Week 4
    { 0:{ type:"Long Run",     dist:5.0,   notes:"Consistent easy effort. Building that aerobic engine." },
      3:{ type:"Threshold",    desc:"2×0.75 mi tempo", notes:"2 min walk between reps. Short, sharp efforts — quality over quantity." },
      4:{ type:"Easy Run",     dist:2.0,   notes:"Easy recovery run." } },
    // Week 5
    { 0:{ type:"Long Run",     dist:5.5,   notes:"Patience is key. Run easy and finish strong." },
      3:{ type:"Threshold",    desc:"2 mi tempo (3 mi total)", notes:"Warmup mile → 2 mi continuous tempo → cooldown. Biggest tempo block yet — stay controlled." },
      4:{ type:"Easy Run",     dist:2.5,   notes:"Aerobic base run. Comfortable, controlled breathing." } },
    // Week 6
    { 0:{ type:"Long Run",     dist:6.0,   notes:"Landmark 6-mile run. Stay easy — trust the base you've built." },
      3:{ type:"Threshold",    desc:"2 mi tempo continuous", notes:"2 miles straight at tempo — full effort. No warmup/cooldown miles built in." },
      4:{ type:"Easy Run",     dist:3.0,   notes:"Easy run. Should feel comfortable by now." } },
    // Week 7
    { 0:{ type:"Long Run",     dist:6.0,   notes:"Consolidation week — same distance as last week. Run it more confidently." },
      3:{ type:"Threshold",    desc:"2×1 mi tempo", notes:"2 min walk recovery between reps. Push each mile rep — these are race-prep efforts." },
      4:{ type:"Easy Run",     dist:2.5,   notes:"Easy recovery run." } },
    // Week 8
    { 0:{ type:"Long Run",     dist:6.5,   notes:"New distance PR. Steady, patient effort all the way." },
      3:{ type:"Threshold",    desc:"2.5 mi tempo (3.5 mi total)", notes:"Warmup mile → 2.5 mi tempo → cooldown. Biggest tempo volume yet — stay controlled." },
      4:{ type:"Easy Run",     dist:3.0,   notes:"Easy aerobic run." } },
    // Week 9
    { 0:{ type:"Long Run",     dist:7.0,   notes:"Peak long run. Stay easy — this is all about time on feet." },
      3:{ type:"Threshold",    desc:"2 mi + 1 mi tempo", notes:"3 miles of tempo broken up: 2 mi hard, short recovery jog, then 1 mi hard. Race simulation." },
      4:{ type:"Easy Run",     dist:3.0,   notes:"Easy run. Save the legs for tempo and the long run." } },
    // Week 10 — Step-back week
    { 0:{ type:"Long Run",     dist:6.0,   notes:"Step-back week. Shorter long run — recover and absorb all that training." },
      3:{ type:"Threshold",    desc:"2 mi tempo continuous", notes:"Familiar effort — use it to gauge how much your fitness has grown." },
      4:{ type:"Easy Run",     dist:2.5,   notes:"Easy recovery run." } },
    // Week 11 — Taper begins
    { 0:{ type:"Long Run",     dist:5.0,   notes:"Taper long run. Stay sharp but don't overdo it — legs are freshening up." },
      3:{ type:"Threshold",    desc:"1.5 mi tempo", notes:"Short, sharp taper tempo. Focus on form and race-pace feel." },
      4:{ type:"Easy Run",     dist:2.0,   notes:"Easy shakeout. Very relaxed." } },
    // Week 12 — Test Week
    { 0:{ type:"5K Time Trial", desc:"Race it!", notes:"Warm up 10–15 min easy → run your best 5K at maximum effort → cool down. This is your benchmark." },
      3:{ type:"Threshold",    desc:"1 mi tempo", notes:"Final tune-up. Short and sharp — keep the legs awake for Sunday." },
      4:{ type:"Easy Run",     dist:2.0,   notes:"Light shakeout only. Very easy — save everything for the time trial." } },
  ]
};

const MAIN_LIFTS  = ["Squat", "Bench Press", "Deadlift", "Overhead Press"];
const DAY_NAMES   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const STORAGE_KEY = "wt-v1";

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════

const DEFAULT_STATE = {
  settings: {
    programStartDate: getLastMonday(),
    trainingMaxes: { "Squat": 225, "Bench Press": 155, "Deadlift": 275, "Overhead Press": 105 }
  },
  liftLogs: [],
  runLogs:  [],
};

let S = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return { ...DEFAULT_STATE, ...p, settings: { ...DEFAULT_STATE.settings, ...p.settings } };
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState() {
  const json = JSON.stringify(S);
  localStorage.setItem(STORAGE_KEY, json);
  // Firefox isolates localStorage per file:// URL, so relay via window.name
  // (window.name survives same-tab navigations across file:// pages)
  try { window.name = 'wt:' + json; } catch(e) {}
}

// ═══════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════

function getLastMonday(from) {
  const d = from ? new Date(from) : new Date();
  d.setHours(12,0,0,0);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d.toISOString().split("T")[0];
}
function todayStr()        { return new Date().toISOString().split("T")[0]; }
function dayOfWeek(ds)     { return new Date(ds + "T12:00:00").getDay(); }
function roundW(w)         { return Math.round(w / 5) * 5; }
function e1rm(w, r)        { if (!w || !r || r <= 0) return 0; return r === 1 ? w : Math.round(w * (1 + r/30)); }
function pad(n)            { return String(n).padStart(2,"0"); }
function fmtDur(s)         { if (!s) return "--"; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return h?`${h}:${pad(m)}:${pad(ss)}`:`${m}:${pad(ss)}`; }
function fmtPace(dist,dur) { if (!dist||!dur) return "--"; const s=dur/dist; return `${Math.floor(s/60)}:${pad(Math.round(s%60))}/mi`; }
function fmtDate(d)        { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function uid()             { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function eid(s)            { return s.replace(/\s+/g,"-"); }

function weekInCycle() {
  const start = new Date(S.settings.programStartDate + "T12:00:00");
  const now   = new Date(); now.setHours(12,0,0,0);
  const days  = Math.floor((now - start) / 86400000);
  if (days < 0) return 0;
  return Math.floor(days / 7) % LIFT_PROGRAM.weekSchemes.length;
}

function totalWeeks() {
  const start = new Date(S.settings.programStartDate + "T12:00:00");
  const now   = new Date(); now.setHours(12,0,0,0);
  const days  = Math.floor((now - start) / 86400000);
  return days < 0 ? 0 : Math.floor(days / 7);
}


function mainLiftSets(lift) {
  const tm = S.settings.trainingMaxes[lift] || 0;
  return LIFT_PROGRAM.weekSchemes[weekInCycle()].sets.map(s => ({
    weight: roundW(tm * s.pct), reps: s.reps, pct: s.pct
  }));
}

function liftToBeat(liftName) {
  const logs = S.liftLogs.filter(l => l.lift === liftName);
  if (!logs.length) return null;
  logs.sort((a,b) => b.date.localeCompare(a.date));
  const last    = logs[0];
  const lastTop = last.sets[last.sets.length - 1];
  const lastE   = e1rm(lastTop.weight, lastTop.reps);
  let bestE = 0, bestLog = null;
  for (const log of logs) {
    const top = log.sets[log.sets.length - 1];
    const est = e1rm(top.weight, top.reps);
    if (est > bestE) { bestE = est; bestLog = log; }
  }
  return { last, lastTop, lastE, bestE, bestLog, isPR: last === bestLog };
}

function lastRun(type) {
  const logs = S.runLogs.filter(l => !type || l.type === type);
  return logs.length ? logs.sort((a,b) => b.date.localeCompare(a.date))[0] : null;
}

function nextLiftDay() {
  const dow = dayOfWeek(todayStr());
  for (let i=1; i<=7; i++) {
    const d = (dow+i)%7;
    if (LIFT_PROGRAM.schedule[d]) return `${DAY_NAMES[d]} — ${LIFT_PROGRAM.schedule[d].name}`;
  }
}
function nextRunDay() {
  const dow = dayOfWeek(todayStr());
  const typeNames = { 0:"Long Run", 3:"Threshold", 4:"Easy Run" };
  for (let i=1; i<=7; i++) {
    const d = (dow+i)%7;
    if (RUN_PROGRAM.days.includes(d)) return `${DAY_NAMES[d]} — ${typeNames[d]}`;
  }
}

function runForDate(dateStr) {
  const dow = dayOfWeek(dateStr);
  if (!RUN_PROGRAM.days.includes(dow)) return null;
  const wk = Math.min(Math.max(0, totalWeeksToDate(dateStr)), RUN_PROGRAM.weeks.length - 1);
  return RUN_PROGRAM.weeks[wk][dow] || null;
}

function weekInCycleForDate(dateStr) {
  const start = new Date(S.settings.programStartDate + "T12:00:00");
  const date  = new Date(dateStr + "T12:00:00");
  const days  = Math.floor((date - start) / 86400000);
  if (days < 0) return 0;
  return Math.floor(days / 7) % LIFT_PROGRAM.weekSchemes.length;
}

function totalWeeksToDate(dateStr) {
  const start = new Date(S.settings.programStartDate + "T12:00:00");
  const date  = new Date(dateStr + "T12:00:00");
  const days  = Math.floor((date - start) / 86400000);
  return days < 0 ? 0 : Math.floor(days / 7);
}

function liftAbbr(lift) {
  return { "Overhead Press":"OHP", "Deadlift":"DL", "Bench Press":"Bench", "Squat":"Squat" }[lift] || lift;
}

function buildCalendar() {
  const today    = todayStr();
  const firstDay = new Date(calYear, calMonth, 1);
  const lastDate = new Date(calYear, calMonth+1, 0).getDate();
  const monthLbl = firstDay.toLocaleDateString("en-US", {month:"long", year:"numeric"});
  // Mon-first offset: (getDay()+6)%7
  const startOffset = (firstDay.getDay() + 6) % 7;

  let cells = [];
  for (let i=0; i<startOffset; i++) cells.push(`<div class="cal-cell empty"></div>`);

  for (let d=1; d<=lastDate; d++) {
    const ds      = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const dow     = dayOfWeek(ds);
    const isToday = ds === today;
    const isPast  = ds < today;
    const liftW   = LIFT_PROGRAM.schedule[dow] || null;
    const runW    = runForDate(ds);
    const hasLift = S.liftLogs.some(l => l.date === ds);
    const hasRun  = S.runLogs.some(l  => l.date === ds);

    // Show week scheme label on Mondays
    let schemeHtml = "";
    if (dow === 1) {
      const wi = weekInCycleForDate(ds);
      schemeHtml = `<span class="cal-scheme">${LIFT_PROGRAM.weekSchemes[wi].label}</span>`;
    }

    const runTagClass = { "Long Run":"cal-tag-long", "Threshold":"cal-tag-thresh", "Easy Run":"cal-tag-easy", "5K Time Trial":"cal-tag-thresh" };
    const runLabel = runW ? (runW.type === "5K Time Trial" ? "5K Trial" : (runW.desc || runW.type)) : "";

    cells.push(`<div class="cal-cell${isToday?" cal-today":isPast?" cal-past":""}" onclick="viewDay('${ds}')">
      <div class="cal-num">
        <span class="${isToday?"cal-num-today":""}">${d}</span>${schemeHtml}
      </div>
      ${liftW ? `<div class="cal-tag cal-tag-lift">${liftAbbr(liftW.mainLift)}</div>` : ""}
      ${runW  ? `<div class="cal-tag ${runTagClass[runW.type]||"cal-tag-easy"}">${runLabel}</div>` : ""}
      ${(hasLift||hasRun) ? `<div class="cal-logged">✓</div>` : ""}
    </div>`);
  }

  // Pad end to complete last row
  const rem = cells.length % 7;
  if (rem) for (let i=0; i<7-rem; i++) cells.push(`<div class="cal-cell empty"></div>`);

  return `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="prevMonth()">‹</button>
      <span class="cal-month-lbl">${monthLbl}</span>
      <button class="cal-nav-btn" onclick="nextMonth()">›</button>
    </div>
    <div class="cal-dow-row">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
    </div>
    <div class="cal-grid">${cells.join("")}</div>
    <div class="cal-legend">
      <div class="cal-legend-item"><span class="cal-tag cal-tag-lift" style="display:inline-block">Lift</span> Lifting</div>
      <div class="cal-legend-item"><span class="cal-tag cal-tag-long" style="display:inline-block">Long Run</span> Long run</div>
      <div class="cal-legend-item"><span class="cal-tag cal-tag-thresh" style="display:inline-block">Threshold</span> Hard/LT run</div>
      <div class="cal-legend-item"><span class="cal-tag cal-tag-easy" style="display:inline-block">Easy Run</span> Easy run</div>
      <div class="cal-legend-item" style="color:var(--green);font-weight:700">✓ Logged</div>
    </div>`;
}

function fmtPaceVal(s)   { return `${Math.floor(s/60)}:${pad(Math.round(s%60))}`; }
function fmtDateShort(d) { return new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"}); }

function sparkline(vals, color="#7c3aed", w=120, h=36) {
  if (!vals || vals.length < 2) return `<span style="font-size:11px;color:var(--muted)">—</span>`;
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
  const px=i=>(i/(vals.length-1))*(w-6)+3;
  const py=v=>h-3-((v-mn)/rng)*(h-6);
  const pts=vals.map((v,i)=>`${px(i)},${py(v)}`).join(" ");
  const lx=px(vals.length-1), ly=py(vals[vals.length-1]);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" opacity=".8"/>
    <circle cx="${lx}" cy="${ly}" r="2.5" fill="${color}"/>
  </svg>`;
}

function svgLine(data, { color="#7c3aed", height=130, invertY=false, fmtY=null }={}) {
  if (!data || data.length < 2) return `<div class="no-data">Not enough data yet — keep logging!</div>`;
  const vals=data.map(d=>d.y);
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
  const PL=46,PR=10,PT=10,PB=26,vW=600,vH=height,W=vW-PL-PR,H=vH-PT-PB;
  const tx=i=>PL+(i/(data.length-1))*W;
  const ty=v=>invertY?PT+((v-mn)/rng)*H:PT+H-((v-mn)/rng)*H;
  const pts=data.map((d,i)=>`${tx(i)},${ty(d.y)}`).join(" ");
  const gridVs=[mn,(mn+mx)/2,mx];
  const grid=gridVs.map(v=>{ const y=ty(v),lbl=fmtY?fmtY(v):Math.round(v); return `<line x1="${PL}" y1="${y}" x2="${PL+W}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${PL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="system-ui">${lbl}</text>`; }).join("");
  const step=Math.max(1,Math.ceil(data.length/7));
  const xLbls=data.map((d,i)=>i%step===0?`<text x="${tx(i)}" y="${vH-2}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">${d.label||""}</text>`:"").join("");
  const dots=data.map((d,i)=>`<circle cx="${tx(i)}" cy="${ty(d.y)}" r="3" fill="${color}" opacity=".9"/>`).join("");
  const lastX=tx(data.length-1), baseY=ty(invertY?mx:mn);
  const area=`<polygon points="${PL},${baseY} ${pts} ${lastX},${baseY}" fill="${color}" opacity=".07"/>`;
  return `<svg viewBox="0 0 ${vW} ${vH}" style="width:100%;height:${vH}px;display:block">${grid}${area}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${dots}${xLbls}</svg>`;
}

function svgBar(data, { color="#10b981", height=130 }={}) {
  if (!data || !data.length) return `<div class="no-data">No data yet</div>`;
  const maxY=Math.max(...data.map(d=>d.y),1);
  const PL=42,PR=10,PT=10,PB=26,vW=600,vH=height,W=vW-PL-PR,H=vH-PT-PB;
  const slotW=W/data.length, barW=Math.max(3,slotW-4);
  const bars=data.map((d,i)=>{ const bh=(d.y/maxY)*H,x=PL+i*slotW+(slotW-barW)/2,y=PT+H-bh; return d.y>0?`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${color}" rx="2"/>`:`<rect x="${x}" y="${PT+H-2}" width="${barW}" height="2" fill="${color}" opacity=".15" rx="1"/>`;}).join("");
  const gridVs=[0,maxY/2,maxY];
  const grid=gridVs.map(v=>{ const y=PT+H-(v/maxY)*H; return `<line x1="${PL}" y1="${y}" x2="${PL+W}" y2="${y}" stroke="var(--border)" stroke-width="1"/><text x="${PL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="system-ui">${Math.round(v)}</text>`;}).join("");
  const step=Math.max(1,Math.ceil(data.length/7));
  const xLbls=data.map((d,i)=>i%step===0?`<text x="${PL+i*slotW+slotW/2}" y="${vH-2}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="system-ui">${d.label||""}</text>`:"").join("");
  return `<svg viewBox="0 0 ${vW} ${vH}" style="width:100%;height:${vH}px;display:block">${grid}${bars}${xLbls}</svg>`;
}

function liftE1rmHistory(lift, n=12) {
  return S.liftLogs.filter(l=>l.lift===lift).sort((a,b)=>a.date.localeCompare(b.date)).slice(-n)
    .map(log=>({ label:fmtDateShort(log.date), y:e1rm(log.sets[log.sets.length-1].weight, log.sets[log.sets.length-1].reps) }));
}

function liftBest(lift) {
  let bestE=0, bestSet=null, bestDate=null;
  for (const log of S.liftLogs.filter(l=>l.lift===lift)) {
    for (const s of log.sets) { const e=e1rm(s.weight,s.reps); if(e>bestE){bestE=e;bestSet=s;bestDate=log.date;} }
  }
  return bestE ? { e1rm:bestE, set:bestSet, date:bestDate } : null;
}

function weeklyMileage(numWeeks=12) {
  const today=new Date(); today.setHours(12,0,0,0);
  const dow=today.getDay();
  const mon0=new Date(today); mon0.setDate(today.getDate()-(dow===0?6:dow-1)); mon0.setHours(0,0,0,0);
  const weeks=[];
  for (let w=numWeeks-1;w>=0;w--) {
    const mon=new Date(mon0); mon.setDate(mon0.getDate()-w*7);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
    const miles=S.runLogs.filter(l=>{const d=new Date(l.date+"T12:00:00");return d>=mon&&d<=sun;}).reduce((s,l)=>s+(l.distance||0),0);
    weeks.push({ label:mon.toLocaleDateString("en-US",{month:"short",day:"numeric"}), y:Math.round(miles*10)/10 });
  }
  return weeks;
}

function paceHistory(type, n=12) {
  return S.runLogs.filter(l=>l.type===type&&l.distance>0&&l.duration>0)
    .sort((a,b)=>a.date.localeCompare(b.date)).slice(-n)
    .map(l=>({ label:fmtDateShort(l.date), y:l.duration/l.distance }));
}

function best5K() {
  const runs=S.runLogs.filter(l=>l.distance>=0.5&&l.duration>0);
  if (!runs.length) return null;
  const bestPace=Math.min(...runs.map(l=>l.duration/l.distance));
  const secs=Math.round(bestPace*3.107);
  const pct=Math.min(100,Math.round(1800/secs*100));
  return { pace:bestPace, secs, pct };
}

function runStatsRow() {
  const totalMiles=S.runLogs.reduce((s,l)=>s+(l.distance||0),0);
  const today=new Date(); today.setHours(12,0,0,0);
  const dow=today.getDay();
  const mon=new Date(today); mon.setDate(today.getDate()-(dow===0?6:dow-1)); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  const weekMiles=S.runLogs.filter(l=>{const d=new Date(l.date+"T12:00:00");return d>=mon&&d<=sun;}).reduce((s,l)=>s+(l.distance||0),0);
  const runs=S.runLogs.filter(l=>l.distance>0&&l.duration>0);
  const bestPace=runs.length?Math.min(...runs.map(l=>l.duration/l.distance)):0;
  return { totalMiles:Math.round(totalMiles*10)/10, weekMiles:Math.round(weekMiles*10)/10, bestPace, total:S.runLogs.length };
}

function setToBeatHtml() {

  const sets=ws.sets.map(s=>({weight:roundW(tm*s.pct),reps:s.reps,pct:s.pct}));
  const lastLog=S.liftLogs.filter(l=>l.lift===lift).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;

}

function liftPRCard(lift) {
  const logs=S.liftLogs.filter(l=>l.lift===lift).sort((a,b)=>b.date.localeCompare(a.date));
  const tm=S.settings.trainingMaxes[lift]||0;
  if (!logs.length) return `<div class="pr-card"><div class="pr-card-hdr"><div class="pr-lift">${lift}</div><div class="pr-tm">TM: ${tm} lbs</div></div><div class="pr-empty-msg">No sessions logged yet</div></div>`;
  const best=liftBest(lift);
  const sparkVals=liftE1rmHistory(lift,10).map(d=>d.y);
  const recent=logs.slice(0,5);
  return `<div class="pr-card">
    <div class="pr-card-hdr"><div class="pr-lift">${lift}</div><div class="pr-tm">TM: ${tm} lbs</div></div>
    <div><div class="pr-best-lbl">Best e1RM</div><div class="pr-best-e1rm">${best.e1rm} <span style="font-size:14px;color:var(--muted)">lbs</span></div><div class="pr-best-set">${best.set.weight}×${best.set.reps} · ${fmtDate(best.date)}</div></div>
    <div class="pr-spark-row">${sparkline(sparkVals,"#7c3aed",120,36)}<div class="pr-spark-lbl">last ${sparkVals.length} sessions<br><span style="color:var(--accent);font-weight:600">e1RM trend</span></div></div>

      ${recent.map(log=>{ const top=log.sets[log.sets.length-1]; const e=e1rm(top.weight,top.reps); const setStr=log.sets.map(s=>`${s.weight}×${s.reps}`).join(", "); return `<div class="pr-hist-row"><span class="pr-hist-date">${fmtDateShort(log.date)}</span><span class="pr-hist-sets">${setStr}</span><span class="pr-hist-e">${e}</span></div>`; }).join("")}
    </div>
  </div>`;
}

function showView(v, tab) {
  currentView = v;
  if (tab !== undefined) progTab = tab;
  window.scrollTo(0, 0);
  render();
}

function switchProgTab(i) {
  progTab = i;
  document.querySelectorAll(".t-btn").forEach((b,j)=>b.classList.toggle("active",i===j));
  document.getElementById("prog-tab-content").innerHTML = i===0?liftsTab():runningTab();
}

let activeTab   = 0;
let calYear     = new Date().getFullYear();
let calMonth    = new Date().getMonth();
let currentView = 'today';   // 'today' | 'progress'
let progTab     = 0;         // 0=Lifts  1=Running  (progress sub-tab)

function render() {
  try {
    document.getElementById("app").innerHTML = currentView === 'progress' ? progressHtml() : html();
  } catch(e) {
    document.getElementById("app").innerHTML = `<div style="color:#ef4444;padding:20px;font-family:monospace;font-size:13px"><strong>Render error:</strong><br>${e.message}<br><pre>${e.stack}</pre></div>`;
    return;
  }
  // Attach nav switches via event listener (more reliable than onclick in innerHTML)
  document.querySelectorAll('[data-view]').forEach(el => {
    el.addEventListener('click', e => {
      e.preventDefault();
      showView(el.dataset.view, el.dataset.tab !== undefined ? parseInt(el.dataset.tab) : undefined);
    });
  });
}

function html() {
  const today = todayStr();
  const dow   = dayOfWeek(today);

  return `
  <nav class="page-nav">
    <a class="pnav-a cur">🏠 Today</a>
    <span class="pnav-sep">/</span>
    <a class="pnav-a" style="cursor:pointer" data-view="progress">📈 Progress</a>

// ── Cards ──

function liftCard(w) {
  const sets     = mainLiftSets(w.mainLift);
  const ltb      = liftToBeat(w.mainLift);
  const isDeload = weekInCycle() === 3;

  // Lift to Beat block
  const ltbHtml = ltb
    ? `<div class="ltb">
        <div class="ltb-label">Lift to Beat${ltb.isPR ? "" : ` — PR: ${ltb.bestE} e1RM`}</div>
        <div class="ltb-value">${ltb.lastTop.weight} lbs × ${ltb.lastTop.reps} reps${ltb.isPR ? `<span class="pr-chip">PR</span>` : ""}</div>
        <div class="ltb-meta">e1RM: ${ltb.lastE} lbs · ${fmtDate(ltb.last.date)}</div>
      </div>`
    : `<div class="ltb empty">
        <div class="ltb-label">Lift to Beat</div>
        <div class="ltb-empty">Log your first session to start tracking</div>
      </div>`;

  // Sets table
  const setsHtml = sets.map((s,i) => {
    const isAmrap = !isDeload && i === sets.length - 1;
    const repsLbl = isAmrap
      ? `<span class="amrap-badge">AMRAP</span>${String(s.reps).replace("+","")}+ reps`
      : `${s.reps} reps`;
    return `<div class="set-row${isAmrap?" amrap-row":""}">
      <span class="set-num">${i+1}</span>
      <span class="set-wt">${s.weight} lbs</span>
      <span class="set-reps">${repsLbl}</span>
      <span class="set-pct">${Math.round(s.pct*100)}%</span>
    </div>`;
  }).join("");

  // Accessory groups
  const groupsHtml = w.groups.map(g => `
    <div class="prog-block">
      <div class="prog-block-label">${g.label}</div>
      ${g.items.map(it => `
        <div class="prog-acc">
          <span>${it.name}</span>
          <span class="prog-acc-detail">${it.sets ? it.sets+"×" : ""}${it.reps}</span>
        </div>`).join("")}
    </div>`).join("");

  return `
  <div class="card card-lift">
    <div class="card-hdr">
      <div class="card-icon">🏋️</div>
      <div><div class="card-title">${w.name}</div><div class="card-sub">Lifting · 5/3/1</div></div>
    </div>

    <div class="prog-block">
      <div class="prog-block-label">Power Primer</div>
      <div class="prog-single">
        <span>${w.powerPrimer.name}</span>
        <span class="prog-single-detail">${w.powerPrimer.sets}×${w.powerPrimer.reps}</span>
      </div>
      ${w.powerPrimer.note ? `<div class="prog-note">${w.powerPrimer.note}</div>` : ""}
    </div>

    <div class="prog-block">
      <div class="prog-block-label">Main Lift</div>
      <div class="main-lift-name">${w.mainLift}</div>
      ${ltbHtml}
      <div class="sets-wrap">
        <div class="sets-hdr"><span>Set</span><span>Weight</span><span>Reps</span><span style="text-align:right">%TM</span></div>
        ${setsHtml}
      </div>
    </div>

    <div class="prog-block">
      <div class="prog-block-label">Heavy Complement</div>
      <div class="prog-single">
        <span>${w.heavyComplement.name}</span>
        <span class="prog-single-detail">${w.heavyComplement.sets}×${w.heavyComplement.reps}</span>
      </div>
    </div>

    <div class="prog-block">
      <div class="prog-block-label">Bodyweight Circuit <span>${w.circuit.note}</span></div>
      <div class="prog-circuit">${w.circuit.exercises.join(" · ")}</div>
    </div>

    ${groupsHtml}

    <div class="prog-block">
      <div class="prog-block-label">Finisher</div>
      <div class="prog-single">
        <span>Incline Treadmill Walk</span>
        <span class="prog-single-detail">15 min</span>
      </div>
      <div class="prog-note">Steep incline · easy walking pace · cooldown</div>
    </div>

    <button class="btn btn-primary log-btn" onclick="openLift('${w.mainLift}','${w.name}')">Log Workout</button>
  </div>`;
}

function runCard(w) {
  const lr = lastRun(w.type);
  const lrHtml = lr
    ? `<div class="last-run">
        <div class="ltb-label">Last ${w.type}</div>
        <div class="ltb-value">${lr.distance} mi · ${fmtDur(lr.duration)}</div>
        <div class="ltb-meta">Pace: ${fmtPace(lr.distance,lr.duration)} · ${fmtDate(lr.date)}</div>
      </div>`
    : `<div class="last-run empty">
        <div class="ltb-label">Last ${w.type}</div>
        <div class="ltb-empty">No ${w.type.toLowerCase()} logged yet</div>
      </div>`;

  const icons = { "Long Run":"🏃", "Threshold":"⚡", "Easy Run":"🌱", "5K Time Trial":"🏁" };
  const targetHtml = w.desc
    ? `<div class="run-speed-block">
        <div class="run-speed-label">Today's Session</div>
        <div class="run-speed-desc">${w.desc}</div>
        <div class="run-speed-notes">${w.notes}</div>
      </div>`
    : `<div class="run-target">
        <div>
          <div class="run-stat-v">${w.dist} mi</div>
          <div class="run-stat-l">target distance</div>
        </div>
      </div>
      <div class="run-notes">${w.notes}</div>`;

  return `
  <div class="card card-run">
    <div class="card-hdr">
      <div class="card-icon">${icons[w.type] || "🏃"}</div>
      <div><div class="card-title">${w.type}</div><div class="card-sub">Running · Week ${Math.min(totalWeeks()+1, RUN_PROGRAM.weeks.length)}</div></div>
    </div>
    ${targetHtml}
    ${lrHtml}
    <button class="btn btn-green log-btn" onclick="openRun('${w.type}')">Log Run</button>
  </div>`;
}

function restCard(label, icon, next) {
  return `
  <div class="card card-rest">
    <div class="card-hdr">
      <div class="card-icon">${icon}</div>
      <div><div class="card-title">Rest Day</div><div class="card-sub">${label}</div></div>
    </div>
    <div class="rest-body">
      <div>No ${label.toLowerCase()} today — recover well.</div>
      ${next ? `<div class="next-up">Next: ${next}</div>` : ""}
    </div>
  </div>`;
}

// ── History ──

function histTab(idx) {
  if (idx === 4) return runHist();
  const lift = MAIN_LIFTS[idx];
  const logs = S.liftLogs.filter(l => l.lift === lift).sort((a,b) => b.date.localeCompare(a.date));
  if (!logs.length) return `<div class="empty-hist"><p>No ${lift} sessions logged yet.</p><p>Your history appears here after your first session.</p></div>`;
  const rows = logs.map(log => {
    const top  = log.sets[log.sets.length-1];
    const est  = e1rm(top.weight, top.reps);
    const sets = log.sets.map(s => `${s.weight}×${s.reps}`).join(", ");
    return `<tr>
      <td>${fmtDate(log.date)}</td>
      <td style="color:var(--dim)">${sets}</td>
      <td class="hl">${top.weight}×${top.reps}</td>
      <td class="hl">${est}</td>
      <td class="hist-actions">
        <button class="hist-act-btn" title="Edit" onclick="editLiftLog('${log.id}')">✏️</button>
        <button class="hist-act-btn" title="Delete" onclick="deleteLiftLog('${log.id}')">🗑️</button>
      </td>
    </tr>`;
  }).join("");
  return `<table><thead><tr><th>Date</th><th>Sets</th><th>Top Set</th><th>e1RM</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function runHist() {
  const logs = [...S.runLogs].sort((a,b) => b.date.localeCompare(a.date));
  if (!logs.length) return `<div class="empty-hist"><p>No runs logged yet.</p><p>Your run history appears here after your first logged run.</p></div>`;
  const rows = logs.map(l => `
    <tr>
      <td>${fmtDate(l.date)}</td>
      <td><span class="type-badge type-${(l.type||'').replace(/\s+/g,"-")}">${l.type||'—'}</span></td>
      <td>${l.distance} mi</td>
      <td class="hl">${fmtDur(l.duration)}</td>
      <td>${fmtPace(l.distance,l.duration)}</td>
      <td class="hist-actions">
        <button class="hist-act-btn" title="Edit" onclick="editRunLog('${l.id}')">✏️</button>
        <button class="hist-act-btn" title="Delete" onclick="deleteRunLog('${l.id}')">🗑️</button>
      </td>
    </tr>`).join("");
  return `<table><thead><tr><th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Pace</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <div style="margin-top:10px;text-align:right"><a style="font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer" data-view="progress" data-tab="1">📈 View Running Progress →</a></div>`;
}

// ═══════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════

function switchTab(i) {
  activeTab = i;
  document.querySelectorAll(".tab").forEach((t,j) => t.classList.toggle("active", i===j));
  document.getElementById("hist-content").innerHTML = histTab(i);
}

function scrollTo(id, btn) {
  document.getElementById(id).scrollIntoView({ behavior: "smooth", block: "start" });
  document.querySelectorAll(".snav-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function openSettings()    { document.getElementById("ov-settings").classList.add("open"); }
function closeOv(id)       { document.getElementById(id).classList.remove("open"); }

function prevMonth() {
  calMonth--; if (calMonth < 0)  { calMonth = 11; calYear--; }
  document.getElementById("cal-body").innerHTML = buildCalendar();
}
function nextMonth() {
  calMonth++; if (calMonth > 11) { calMonth = 0;  calYear++; }
  document.getElementById("cal-body").innerHTML = buildCalendar();
}

// ── Unified Logger ──

let logCtx = { mode: 'lift', date: '', lift: 'Squat', type: '', editId: null };
let lgSets = [];

function openLogger(opts = {}) {
  logCtx = {
    mode:   opts.mode   || 'lift',
    date:   opts.date   || todayStr(),
    lift:   opts.lift   || 'Squat',
    type:   opts.type   || '',
    editId: opts.editId || null,
  };
  document.querySelector('#ov-logger h3').textContent = logCtx.editId ? 'Edit Workout' : 'Log Workout';
  document.getElementById('lg-date').value = logCtx.date;
  const liftSel = document.getElementById('lg-lift');
  liftSel.value = MAIN_LIFTS.includes(logCtx.lift) ? logCtx.lift : '__custom__';
  if (!MAIN_LIFTS.includes(logCtx.lift) && logCtx.lift) {
    document.getElementById('lg-custom-name').value = logCtx.lift;
  }
  document.getElementById('lg-run-type').value = logCtx.type || '';
  document.getElementById('lg-notes').value     = opts.notes    || '';
  document.getElementById('lg-run-notes').value = opts.runNotes || '';
  document.getElementById('lg-run-dist').value  = opts.dist     || '';
  const dur = opts.duration || 0;
  document.getElementById('lg-run-h').value = dur ? (Math.floor(dur/3600) || '') : '';
  document.getElementById('lg-run-m').value = dur ? (Math.floor((dur%3600)/60) || '') : '';
  document.getElementById('lg-run-s').value = dur ? (dur%60 || '') : '';
  setLogMode(logCtx.mode);
  if (opts.editSets) {
    lgSets = opts.editSets.map(s => ({ weight: s.weight, reps: s.reps }));
    document.getElementById('lg-custom-name-wrap').style.display = MAIN_LIFTS.includes(logCtx.lift) ? 'none' : '';
    document.getElementById('lg-week-hint').innerHTML = `<div class="lg-week-hint">Editing logged session — weights are as recorded</div>`;
    renderSetRows();
  } else {
    refreshSetRows();
  }
  document.getElementById('ov-logger').classList.add('open');
}

function setLogMode(mode) {
  logCtx.mode = mode;
  document.querySelectorAll('.lg-mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('lg-lift-panel').style.display = mode === 'lift' ? '' : 'none';
  document.getElementById('lg-run-panel').style.display  = mode === 'run'  ? '' : 'none';
  document.getElementById('lg-save-btn').textContent = mode === 'lift' ? 'Save Lift' : 'Save Run';
}

function onLogDateChange() { refreshSetRows(); }
function onLogLiftChange() { refreshSetRows(); }

function refreshSetRows() {
  const lift = document.getElementById('lg-lift').value;
  const date = document.getElementById('lg-date').value || todayStr();
  const isCustom = lift === '__custom__';
  document.getElementById('lg-custom-name-wrap').style.display = isCustom ? '' : 'none';
  if (!isCustom) {
    const wi = weekInCycleForDate(date);
    const ws = LIFT_PROGRAM.weekSchemes[wi];
    const tm = S.settings.trainingMaxes[lift] || 0;
    const isDeload = wi === 3;
    lgSets = ws.sets.map((s, i) => ({
      weight:  roundW(tm * s.pct),
      reps:    typeof s.reps === 'number' ? s.reps : String(s.reps).replace('+', ''),
      pct:     s.pct,
      isAmrap: !isDeload && i === ws.sets.length - 1,
    }));
    document.getElementById('lg-week-hint').innerHTML =
      tm ? `<div class="lg-week-hint">Week ${wi+1} · ${ws.label} · TM: ${tm} lbs</div>` : '';
  } else {
    lgSets = [{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}];
    document.getElementById('lg-week-hint').innerHTML = '';
  }
  renderSetRows();
}

function renderSetRows() {
  document.getElementById('lg-sets-body').innerHTML = lgSets.map((s, i) => {
    const lbl = s.isAmrap
      ? `<span class="amrap-badge">AMRAP</span>${s.pct ? Math.round(s.pct*100)+'%' : ''}`
      : `Set ${i+1}${s.pct ? ' · '+Math.round(s.pct*100)+'%' : ''}`;
    return `<div class="lg-set-row">
      <span class="lg-set-lbl">${lbl}</span>
      <input type="number" id="lgw-${i}" class="lg-set-input" value="${s.weight}" placeholder="lbs">
      <span class="lg-x">×</span>
      <input type="number" id="lgr-${i}" class="lg-set-input" value="${s.reps}" placeholder="reps">
      <button class="lg-del-btn" onclick="removeSetRow(${i})">×</button>
    </div>`;
  }).join('');
}

function syncSetValues() {
  lgSets.forEach((_, i) => {
    const w = document.getElementById(`lgw-${i}`);
    const r = document.getElementById(`lgr-${i}`);
    if (w) lgSets[i].weight = w.value;
    if (r) lgSets[i].reps   = r.value;
  });
}

function addSetRow() {
  syncSetValues();
  lgSets.push({ weight: '', reps: '' });
  renderSetRows();
  setTimeout(() => { const els = document.querySelectorAll('.lg-set-input'); if(els.length) els[els.length-2].focus(); }, 50);
}

function removeSetRow(i) {
  if (lgSets.length <= 1) return;
  syncSetValues();
  lgSets.splice(i, 1);
  renderSetRows();
}

function saveWorkout() {
  const date = document.getElementById('lg-date').value || todayStr();
  if (logCtx.mode === 'lift') {
    const sel      = document.getElementById('lg-lift').value;
    const isCustom = sel === '__custom__';
    const liftName = isCustom
      ? (document.getElementById('lg-custom-name').value.trim() || 'Custom')
      : sel;
    const notes = document.getElementById('lg-notes').value.trim();
    const sets  = lgSets.map((_, i) => ({
      weight: parseInt(document.getElementById(`lgw-${i}`)?.value) || 0,
      reps:   parseInt(document.getElementById(`lgr-${i}`)?.value) || 0,
    })).filter(s => s.weight > 0 && s.reps > 0);
    if (!sets.length) return;
    if (logCtx.editId) {
      const idx = S.liftLogs.findIndex(l => l.id === logCtx.editId);
      if (idx >= 0) S.liftLogs[idx] = { ...S.liftLogs[idx], date, lift: liftName, sets, notes };
    } else {
      S.liftLogs.push({ id: uid(), date, lift: liftName, workout: liftName, sets, notes });
    }
  } else {
    const type     = document.getElementById('lg-run-type').value.trim();
    const distance = parseFloat(document.getElementById('lg-run-dist').value);
    const h        = parseInt(document.getElementById('lg-run-h').value) || 0;
    const m        = parseInt(document.getElementById('lg-run-m').value) || 0;
    const s        = parseInt(document.getElementById('lg-run-s').value) || 0;
    const duration = h*3600 + m*60 + s;
    const notes    = document.getElementById('lg-run-notes').value.trim();
    if (!type || !distance || !duration) return;
    if (logCtx.editId) {
      const idx = S.runLogs.findIndex(l => l.id === logCtx.editId);
      if (idx >= 0) S.runLogs[idx] = { ...S.runLogs[idx], date, type, distance, duration, notes };
    } else {
      S.runLogs.push({ id: uid(), date, type, distance, duration, notes });
    }
  }
  saveState(); closeOv('ov-logger'); render();
}

// Back-compat: card buttons still call these
function openLift(lift, workout) { openLogger({ mode: 'lift', lift, date: todayStr() }); }
function openRun(type)           { openLogger({ mode: 'run',  type, date: todayStr() }); }

// ── Edit / Delete ──

function editLiftLog(id) {
  const log = S.liftLogs.find(l => l.id === id);
  if (!log) return;
  openLogger({ mode: 'lift', date: log.date, lift: log.lift, editId: id, notes: log.notes || '', editSets: log.sets });
}
function deleteLiftLog(id) {
  if (!confirm('Delete this lift session?')) return;
  S.liftLogs = S.liftLogs.filter(l => l.id !== id);
  saveState(); render();
}
function editRunLog(id) {
  const log = S.runLogs.find(l => l.id === id);
  if (!log) return;
  openLogger({ mode: 'run', date: log.date, type: log.type, editId: id, dist: log.distance, duration: log.duration, runNotes: log.notes || '' });
}
function deleteRunLog(id) {
  if (!confirm('Delete this run?')) return;
  S.runLogs = S.runLogs.filter(l => l.id !== id);
  saveState(); render();
}

// Log from day-preview modal
let _dayPreviewDate = '';
function logFromDay(mode) {
  closeOv('ov-day');
  openLogger({ mode, date: _dayPreviewDate, lift: LIFT_PROGRAM.schedule[dayOfWeek(_dayPreviewDate)]?.mainLift || 'Squat' });
}

function setsForWeek(lift, weekIdx) {
  const tm = S.settings.trainingMaxes[lift] || 0;
  return LIFT_PROGRAM.weekSchemes[weekIdx].sets.map(s => ({
    weight: roundW(tm * s.pct), reps: s.reps, pct: s.pct
  }));
}

function fmtDateLong(ds) {
  return new Date(ds + "T12:00:00").toLocaleDateString("en-US",
    { weekday:"long", month:"long", day:"numeric", year:"numeric" });
}

function viewDay(ds) {
  _dayPreviewDate = ds;
  const dow   = dayOfWeek(ds);
  const wi    = weekInCycleForDate(ds);
  const ws    = LIFT_PROGRAM.weekSchemes[wi];
  const liftW = LIFT_PROGRAM.schedule[dow] || null;
  const runW  = runForDate(ds);
  const isDeload = wi === 3;

  document.getElementById("day-modal-date").textContent = fmtDateLong(ds);
  document.getElementById("day-modal-week").textContent = `Week ${wi+1} of 4 — ${ws.label}`;

  let body = "";

  if (liftW) {
    const sets = setsForWeek(liftW.mainLift, wi);
    const setsRows = sets.map((s,i) => {
      const isAmrap = !isDeload && i === sets.length - 1;
      const repsLbl = isAmrap
        ? `<span class="amrap-badge">AMRAP</span>${String(s.reps).replace("+","")}+`
        : `${s.reps} reps`;
      return `<div class="set-row${isAmrap?" amrap-row":""}">
        <span class="set-num">${i+1}</span>
        <span class="set-wt">${s.weight} lbs</span>
        <span class="set-reps">${repsLbl}</span>
        <span class="set-pct">${Math.round(s.pct*100)}%</span>
      </div>`;
    }).join("");

    const groupsHtml = liftW.groups.map(g => `
      <div class="day-section">
        <div class="day-section-lbl">${g.label}</div>
        ${g.items.map(it => `<div class="day-acc"><span>${it.name}</span><span class="day-acc-d">${it.sets?it.sets+"×":""}${it.reps}</span></div>`).join("")}
      </div>`).join("");

    body += `
      <div class="day-section">
        <div class="day-section-lbl">Power Primer</div>
        <div class="day-single"><span>${liftW.powerPrimer.name}</span><span class="day-single-detail">${liftW.powerPrimer.sets}×${liftW.powerPrimer.reps}</span></div>
        ${liftW.powerPrimer.note ? `<div class="day-note">${liftW.powerPrimer.note}</div>` : ""}
      </div>
      <div class="day-section">
        <div class="day-section-lbl">Main Lift — ${liftW.mainLift}</div>
        <div class="sets-wrap">${setsRows}</div>
      </div>
      <div class="day-section">
        <div class="day-section-lbl">Heavy Complement</div>
        <div class="day-single"><span>${liftW.heavyComplement.name}</span><span class="day-single-detail">${liftW.heavyComplement.sets}×${liftW.heavyComplement.reps}</span></div>
      </div>
      <div class="day-section">
        <div class="day-section-lbl">Bodyweight Circuit <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px">${liftW.circuit.note}</span></div>
        <div class="day-circuit">${liftW.circuit.exercises.join(" · ")}</div>
      </div>
      ${groupsHtml}`;
  } else {
    body += `<div class="day-section"><div class="day-rest">No lifting scheduled.</div></div>`;
  }

  if (runW) {
    const target = runW.desc
      ? `<div class="day-run-type">${runW.desc}</div><div class="day-run-target">${runW.notes}</div>`
      : `<div class="day-run-type">${runW.dist} mi</div><div class="day-run-target">${runW.notes}</div>`;
    body += `<div class="day-section"><div class="day-section-lbl">${runW.type}</div>${target}</div>`;
  } else {
    body += `<div class="day-section"><div class="day-rest">No run scheduled.</div></div>`;
  }

  document.getElementById("day-modal-body").innerHTML = body;
  document.getElementById("ov-day").classList.add("open");
}



function saveSettings() {
  MAIN_LIFTS.forEach(l => {
    const v = parseInt(document.getElementById(`tm-${eid(l)}`).value);
    if (v>0) S.settings.trainingMaxes[l] = v;
  });
  const d = document.getElementById("prog-start").value;
  if (d) S.settings.programStartDate = d;
  saveState(); closeOv("ov-settings"); render();
}

// Close overlay on backdrop click
document.addEventListener("click", e => {
  if (e.target.classList.contains("overlay")) e.target.classList.remove("open");
});
